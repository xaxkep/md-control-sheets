<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Command Center - Google Sheets Engine</title>
    
    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MD Office">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            background-color: #f8fafc; /* Slate-50 */
            color: #1e293b;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 15% 15%, rgba(20, 184, 166, 0.04) 0%, transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.04) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.01) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }
        .hindi-text { 
            line-height: 1.7; 
            font-family: 'Noto Sans Devanagari', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .glass-panel-hover:hover {
            border-color: rgba(99, 102, 241, 0.2);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 8px 15px -6px rgba(0, 0, 0, 0.03);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.18s ease-out forwards;
        }
        .animate-slide-up {
            animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1, h2, h3, h4, h5, h6, th, .uppercase.tracking-wider, .font-bold.text-slate-400 {
            font-weight: 500 !important;
        }
    </style>
</head>
<body class="text-slate-800 bg-[#f8fafc] min-h-screen flex flex-col selection:bg-teal-500/20 selection:text-teal-900">
    <!-- Global Error Fallback UI -->
    <div id="error-fallback" style="display:none; padding: 24px; background: #fff5f5; color: #c53030; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border: 2px solid #fc8181; margin: 24px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 9999; position: relative;">
        <h2 style="margin-top: 0; font-size: 20px; font-weight: 700;">MD Command Center: Startup Error</h2>
        <p style="font-size: 14px; margin: 8px 0; color: #742a2a;">The application failed to load. This usually happens if CDNs are blocked or if a runtime exception occurred.</p>
        <p id="error-message" style="font-weight: 700; font-size: 15px; margin: 16px 0; border-left: 4px solid #c53030; padding-left: 12px;"></p>
        <pre id="error-stack" style="background: #fff; padding: 16px; border: 1px solid #fed7d7; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.5; color: #4a5568; font-family: monospace;"></pre>
    </div>
    <script>
        window.addEventListener('error', function(event) {
            console.error("Global Error Caught:", event.error || event.message);
            var fallback = document.getElementById('error-fallback');
            if (fallback) {
                fallback.style.display = 'block';
                document.getElementById('error-message').textContent = event.message || (event.error && event.error.message) || event;
                document.getElementById('error-stack').textContent = (event.error && event.error.stack) || 'No stack trace available';
            }
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.error("Global Promise Rejection Caught:", event.reason);
            var fallback = document.getElementById('error-fallback');
            if (fallback) {
                fallback.style.display = 'block';
                document.getElementById('error-message').textContent = 'Unhandled Rejection: ' + (event.reason ? (event.reason.message || event.reason) : 'Unknown Reason');
                document.getElementById('error-stack').textContent = (event.reason && event.reason.stack) || 'No stack trace available';
            }
        });
    </script>
    <div id="root" class="flex-grow flex flex-col"></div>

        // SOP Wizard Modal for weekly affirmation checks
        function SOPWizardModal({ isOpen, activeSopDocs, activeRole, sopReadRecords, setSopReadRecords, isSandbox, onClose, auth, showNotification, ensureValidToken }) {
            const [showReasonInput, setShowReasonInput] = React.useState(false);
            const [deviationReason, setDeviationReason] = React.useState('');
            const [submitting, setSubmitting] = React.useState(false);
            const [initialTotalCount, setInitialTotalCount] = React.useState(0);

            // Get flat list of active policies to verify
            const policiesToVerify = React.useMemo(() => {
                const list = [];
                if (!activeSopDocs) return [];
                const currentWeekCode = getCurrentWeekCode();
                const userEmail = activeRole?.email?.toLowerCase();
                
                activeSopDocs.forEach(sop => {
                    if (sop.policies) {
                        sop.policies.forEach(p => {
                            if (p.status !== 'Inactive') {
                                const alreadyAnswered = sopReadRecords && sopReadRecords.some(record => 
                                    String(record.userEmail).trim().toLowerCase() === String(userEmail).trim().toLowerCase() &&
                                    String(record.weekCode).trim().toLowerCase() === String(currentWeekCode).trim().toLowerCase() &&
                                    String(record.sopId).trim().toLowerCase() === String(p.sopId).trim().toLowerCase() &&
                                    String(record.policyId).trim().toLowerCase() === String(p.policyId).trim().toLowerCase()
                                );
                                if (!alreadyAnswered) {
                                    list.push(p);
                                }
                            }
                        });
                    }
                });
                return list;
            }, [activeSopDocs, sopReadRecords, activeRole]);

            const currentPolicy = policiesToVerify[0]; // Always show the first remaining policy

            const allActivePolicies = React.useMemo(() => {
                const list = [];
                if (!activeSopDocs) return [];
                activeSopDocs.forEach(sop => {
                    if (sop.policies) {
                        sop.policies.forEach(p => {
                            if (p.status !== 'Inactive') {
                                list.push(p);
                            }
                        });
                    }
                });
                return list;
            }, [activeSopDocs]);

            const currentPolicyIndex = React.useMemo(() => {
                if (!currentPolicy || !allActivePolicies) return -1;
                return allActivePolicies.findIndex(p => 
                    String(p.sopId).trim().toLowerCase() === String(currentPolicy.sopId).trim().toLowerCase() &&
                    String(p.policyId).trim().toLowerCase() === String(currentPolicy.policyId).trim().toLowerCase()
                );
            }, [currentPolicy, allActivePolicies]);

            const currentStepNum = currentPolicyIndex !== -1 ? currentPolicyIndex + 1 : 1;
            const totalPoliciesCount = allActivePolicies.length;
            const progressPercent = totalPoliciesCount > 0 
                ? Math.round(((currentStepNum - 1) / totalPoliciesCount) * 100) 
                : 0;

            // Set initial count when modal opens
            React.useEffect(() => {
                if (isOpen) {
                    setInitialTotalCount(policiesToVerify.length);
                    setShowReasonInput(false);
                    setDeviationReason('');
                }
            }, [isOpen]);

            const handleClose = () => {
                onClose();
            };

            if (!isOpen || policiesToVerify.length === 0) return null;

            const parseInlineStyles = (txt) => {
                const parts = String(txt).split('**');
                return parts.map((part, i) => {
                    if (i % 2 === 1) {
                        return <strong key={i} className="font-extrabold text-slate-900">{part}</strong>;
                    }
                    return part;
                });
            };

            const renderFormattedPolicyText = (text) => {
                if (!text) return '';
                const lines = String(text).split('\n');
                let isInsideList = false;
                const elements = [];
                
                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('* ') || trimmed.startsWith('- ') || trimmed.startsWith('• ')) {
                        if (!isInsideList) {
                            isInsideList = true;
                        }
                        const content = trimmed.substring(2);
                        elements.push(<li key={`li-${index}`} className="ml-5 list-disc mt-1 text-slate-700">{parseInlineStyles(content)}</li>);
                    } else {
                        isInsideList = false;
                        elements.push(<p key={`p-${index}`} className="mt-2 text-sm leading-relaxed text-slate-650">{parseInlineStyles(line)}</p>);
                    }
                });
                return <div className="space-y-1">{elements}</div>;
            };

            const handleAnswer = async (compliance, reason = '') => {
                const record = {
                    timestamp: formatDateTimeString(new Date()),
                    userEmail: activeRole.email.toLowerCase(),
                    department: activeRole.mapping?.deptName || 'Unknown',
                    sopId: currentPolicy.sopId,
                    policyId: currentPolicy.policyId,
                    weekCode: getCurrentWeekCode(),
                    compliance,
                    reason
                };

                setSubmitting(true);
                try {
                    if (isSandbox) {
                        setSopReadRecords(prev => [...prev, record]);
                        const savedRecords = JSON.parse(localStorage.getItem('pcil_sopReadRecords') || '[]');
                        localStorage.setItem('pcil_sopReadRecords', JSON.stringify([...savedRecords, record]));
                        showNotification('Policy compliance saved locally in Demo Sandbox mode!', 'success');
                        
                        if (policiesToVerify.length <= 1) {
                            onClose();
                            showNotification('SOP compliance verification completed successfully!', 'success');
                        } else {
                            setShowReasonInput(false);
                            setDeviationReason('');
                        }
                    } else {
                        const body = {
                            values: [[
                                record.timestamp,
                                record.userEmail,
                                record.department,
                                record.sopId,
                                record.policyId,
                                record.weekCode,
                                record.compliance,
                                record.reason
                            ]]
                        };
                        const tokenVal = await ensureValidToken();
                        const response = await fetch(
                            `https://sheets.googleapis.com/v4/spreadsheets/${CENTRAL_CONFIG_SPREADSHEET_ID}/values/SOPReadRecords!A:A:append?valueInputOption=USER_ENTERED`,
                            {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${tokenVal}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(body)
                            }
                        );

                        if (response.ok) {
                            setSopReadRecords(prev => [...prev, record]);
                            const savedRecords = JSON.parse(localStorage.getItem('pcil_sopReadRecords') || '[]');
                            localStorage.setItem('pcil_sopReadRecords', JSON.stringify([...savedRecords, record]));
                            showNotification('Policy compliance saved successfully!', 'success');
                            
                            if (policiesToVerify.length <= 1) {
                                onClose();
                                showNotification('SOP compliance verification completed successfully!', 'success');
                            } else {
                                setShowReasonInput(false);
                                setDeviationReason('');
                            }
                        } else {
                            throw new Error('Failed to append row to Google Sheets');
                        }
                    }
                } catch (err) {
                    console.error('[SOP Wizard] Submission failed:', err);
                    showNotification('Failed to submit compliance record. Please try again.', 'error');
                } finally {
                    setSubmitting(false);
                }
            };



            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-slate-950/70 backdrop-blur-md animate-fade-in">
                    <div className="w-full max-w-xl bg-white border border-slate-200 rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col gap-4 relative text-slate-800 max-h-[92vh] overflow-y-auto animate-scale-up">
                        {/* Close button at top right */}
                        <button
                            onClick={handleClose}

                        </button>

                        {submitting && (

                                <span className="text-sm font-bold text-slate-600">Saving your progress...</span>

                        <div className="flex flex-col gap-1.5 border-b border-slate-100 pb-3">
                            <span className="text-[10px] uppercase font-extrabold tracking-wider text-teal-600">Weekly SOP Verification Checklist</span>
                            <h3 className="text-lg font-extrabold text-slate-900 leading-tight">
                                SOP Compliance Affirmation
                            </h3>
                            <p className="text-[11px] text-slate-500 font-medium">
                                Please review and affirm your compliance for week <span className="font-bold text-slate-700">{getCurrentWeekCode()}</span>.
                            </p>
                        </div>

                        {/* Progress bar */}
                        <div className="flex flex-col gap-1.5">
                            <div className="flex justify-between items-center text-[10px] font-bold text-slate-400">
                                <span>Policy {currentStepNum} of {totalPoliciesCount}</span>
                                <span>{progressPercent}% Completed</span>
                            </div>
                            <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-teal-500 h-full rounded-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                            </div>
                        </div>

                        {/* Policy display card */}
                        <div className="bg-gradient-to-br from-slate-50 to-slate-100/50 border border-slate-200/60 rounded-2xl p-4 md:p-5 flex flex-col gap-3 shadow-inner">
                            <div className="flex justify-between items-start gap-2 border-b border-slate-200/55 pb-2.5">
                                <div>
                                    <span className="text-[9px] font-bold text-teal-600 uppercase tracking-wider block mb-0.5">SOP DOCUMENT</span>
                                    <h4 className="text-xs font-extrabold text-slate-900 uppercase tracking-tight">{currentPolicy.sopName}</h4>
                                    <div className="flex gap-2 items-center mt-1">
                                        <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">SOP ID: {currentPolicy.sopId}</span>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-1">
                                    <span className="px-2 py-0.5 rounded bg-teal-50 text-[10px] font-bold text-teal-700 border border-teal-200/50 uppercase tracking-wider">{currentPolicy.policyId}</span>
                                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">POLICY AREA</span>
                                </div>
                            </div>

                            {/* Render text editor formatted policies */}
                            <div className="max-h-[30vh] overflow-y-auto pr-1">
                                {renderFormattedPolicyText(currentPolicy.policyText)}

                        {/* Interactive affirmation selectors */}
                        {!showReasonInput ? (
                            <div className="flex flex-col sm:flex-row gap-3 mt-1">
                                <button
                                    onClick={() => handleAnswer('Following')}
                                    className="flex-1 py-3 px-4 rounded-xl font-extrabold text-sm text-white bg-emerald-600 hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-emerald-600/10 hover:shadow-emerald-700/20 active:scale-95"
                                >
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                    Following
                                </button>
                                <button
                                    onClick={() => setShowReasonInput(true)}
                                    className="flex-1 py-3 px-4 rounded-xl font-extrabold text-sm text-white bg-amber-600 hover:bg-amber-700 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-amber-600/10 hover:shadow-amber-700/20 active:scale-95"
                                >
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

                        ) : (
                            <div className="flex flex-col gap-3 mt-1 animate-slide-up">
                                <label className="text-[11px] font-bold text-amber-750 flex items-center gap-1.5 bg-amber-50 border border-amber-200/50 rounded-xl p-2.5">
                                    <svg className="w-4 h-4 text-amber-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

                                        }}
                                        className="py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 transition-all cursor-pointer flex-1 text-center shadow-md shadow-amber-600/10"

        }

        // SOP Admin Dashboard for Managing Director (MD)
        function SOPAdminDashboard({ onClose, sops, setSops, sopMappings, setSopMappings, sopReadRecords, setSopReadRecords, mappings, isSandbox, showNotification, deptGroups, setDeptGroups, ensureValidToken, mdEmail, effectivePermissions }) {
            const [activeTab, setActiveTab] = React.useState('compliance'); // 'compliance' | 'policies' | 'mappings'
            const [selectedWeek, setSelectedWeek] = React.useState(getCurrentWeekCode());
            const [isNewSopIdOption, setIsNewSopIdOption] = React.useState(false);
            const [selectedSopFilter, setSelectedSopFilter] = React.useState('All');
            const [expandedCell, setExpandedCell] = React.useState({ coordinatorEmail: '', tab: '' });
            
            const toggleExpandCell = (email, tabName) => {
                const lowerEmail = email.toLowerCase();
                setSelectedSopFilter('All');
                setExpandedCell(prev => {
                    if (prev.coordinatorEmail === lowerEmail && prev.tab === tabName) {
                        return { coordinatorEmail: '', tab: '' };
                    }
                    return { coordinatorEmail: lowerEmail, tab: tabName };
                });
            };
            
            const [expandedSops, setExpandedSops] = React.useState({});
            const [sopViewModes, setSopViewModes] = React.useState({}); // mapping of { [sopId.toLowerCase()]: 'document' | 'list' }
            
            const toggleExpandSop = (sopId) => {
                const lowerSopId = sopId.toLowerCase();
                setExpandedSops(prev => (!prev[lowerSopId] ? { [lowerSopId]: true } : {}));
            };

            const parseInlineStyles = (txt) => {
                const parts = String(txt).split('**');
                return parts.map((part, i) => {
                    if (i % 2 === 1) {
                        return <strong key={i} className="font-extrabold text-slate-900">{part}</strong>;
                    }
                    return part;
                });
            };

            const renderDocumentStylePolicy = (policy) => {
                if (!policy.policyText) return '';
                const lines = String(policy.policyText).split('\n');
                let isInsideList = false;
                const elements = [];
                
                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('* ') || trimmed.startsWith('- ') || trimmed.startsWith('• ')) {
                        if (!isInsideList) {
                            isInsideList = true;
                        }
                        const content = trimmed.substring(2);
                        elements.push(<li key={`li-${index}`} className="ml-5 list-disc mt-1 text-slate-700">{parseInlineStyles(content)}</li>);
                    } else {
                        isInsideList = false;
                        if (index === 0) {
                            // Prepend policy title bolded on the first line
                            elements.push(
                                <p key={`p-${index}`} className="text-sm leading-relaxed text-slate-800">
                                    <strong className="font-extrabold text-slate-950 mr-1.5">{policy.policyId}:</strong>
                                    {parseInlineStyles(line)}
                                </p>
                            );
                        } else {
                            elements.push(<p key={`p-${index}`} className="mt-2 text-sm leading-relaxed text-slate-700">{parseInlineStyles(line)}</p>);
                        }
                    }
                });
                return <div className="space-y-1">{elements}</div>;
            };

            const [mappingsSubTab, setMappingsSubTab] = React.useState('active-mappings'); // 'active-mappings' | 'groups'
            const [editingGroup, setEditingGroup] = React.useState(null); // { groupId: '', deptIds: [], isNew: true }
            const [isNewGroupInline, setIsNewGroupInline] = React.useState(false);
            const [inlineGroupMembers, setInlineGroupMembers] = React.useState([]);

            const uniqueGroups = React.useMemo(() => {
                const groups = {};
                if (deptGroups) {
                    deptGroups.forEach(g => {
                        if (!groups[g.groupId]) {
                            groups[g.groupId] = {
                                groupId: g.groupId,
                                deptIds: []
                            };
                        }
                        if (g.deptId && !groups[g.groupId].deptIds.includes(g.deptId)) {
                            groups[g.groupId].deptIds.push(g.deptId);
                        }
                    });
                }
                return Object.values(groups);
            }, [deptGroups]);

            // Save DeptGroups to spreadsheet or local state
            const saveDeptGroups = async (updatedGroups) => {
                try {
                    if (isSandbox) {
                        setDeptGroups(updatedGroups);
                        localStorage.setItem('pcil_deptGroups', JSON.stringify(updatedGroups));
                        showNotification('Department groups updated in Sandbox local database!', 'success');
                    } else {
                        const headers = ['groupId', 'deptId'];
                        const values = [
                            headers,
                            ...updatedGroups.map(g => [g.groupId, g.deptId])
                        ];
                        const tokenVal = await ensureValidToken();
                        const response = await fetch(
                            `https://sheets.googleapis.com/v4/spreadsheets/${CENTRAL_CONFIG_SPREADSHEET_ID}/values/DeptGroups!A:B?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${tokenVal}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ values })
                            }
                        );
                        if (response.ok) {
                            setDeptGroups(updatedGroups);
                            localStorage.setItem('pcil_deptGroups', JSON.stringify(updatedGroups));
                            showNotification('Department groups updated successfully in Google Sheets!', 'success');
                        } else {
                            throw new Error('Failed to update Google Sheet');
                        }
                    }
                } catch (err) {
                    console.error('[SOP Admin] Save department groups failed:', err);
                    showNotification('Failed to save group changes.', 'error');
                }
            };

            // Policy Editor States
            const [editingPolicy, setEditingPolicy] = React.useState(null); // { sopId, sopName, policyId, policyText, status, isNew }
            const [newSopId, setNewSopId] = React.useState('');
            const [newSopName, setNewSopName] = React.useState('');
            const textareaRef = React.useRef(null);

            // Mappings States
            const [editingMapping, setEditingMapping] = React.useState(null); // { targetId, type, sopId, isNew }
            const [newMappingTargetId, setNewMappingTargetId] = React.useState('');
            const [newMappingType, setNewMappingType] = React.useState('dept'); // 'dept' | 'group'
            const [newMappingSopId, setNewMappingSopId] = React.useState('');

            // Get unique weeks present in records
            const uniqueWeeks = React.useMemo(() => {
                const weeks = new Set();
                weeks.add(getCurrentWeekCode());
                if (sopReadRecords) {
                    sopReadRecords.forEach(r => {
                        if (r.weekCode) weeks.add(r.weekCode);
                    });
                }
                return Array.from(weeks).sort().reverse();
            }, [sopReadRecords]);

            const uniqueSopsList = React.useMemo(() => {
                const map = new Map();
                if (sops) {
                    sops.forEach(s => {
                        if (s.sopId && !map.has(s.sopId)) {
                            map.set(s.sopId, s.sopName || s.sopId);
                        }
                    });
                }
                return Array.from(map.entries()).map(([id, name]) => ({ id, name }));
            }, [sops]);

            // Calculate coordinator compliance details for the selected week
            const coordinatorComplianceData = React.useMemo(() => {
                if (!mappings || !sops || !sopMappings || !sopReadRecords) return [];
                
                return mappings.map(map => {
                    const email = map.headEmail.toLowerCase();
                    
                    // Resolve assigned SOP IDs
                    const mappedSopIds = sopMappings
                        .filter(m => String(m.type).trim().toLowerCase() === 'dept' && String(m.targetId).trim().toLowerCase() === String(map.id).trim().toLowerCase())
                        .map(m => String(m.sopId).trim().toLowerCase());
                    
                    const resolvedSopIds = new Set(mappedSopIds);
                    if (Array.isArray(map.sops)) {
                        map.sops.forEach(s => resolvedSopIds.add(String(s.id).trim().toLowerCase()));
                    }
                    
                    // Resolve group-level mappings dynamically
                    const groupIds = deptGroups
                        .filter(g => String(g.deptId).trim().toLowerCase() === String(map.id).trim().toLowerCase())
                        .map(g => String(g.groupId).trim().toLowerCase());
                    
                    const groupSopIds = sopMappings
                        .filter(m => {
                            const mType = String(m.type).trim().toLowerCase();
                            const mTarget = String(m.targetId).trim().toLowerCase();
                            return mType === 'group' && (groupIds.includes(mTarget) || mTarget === 'default');
                        })
                        .map(m => String(m.sopId).trim().toLowerCase());
                        
                    groupSopIds.forEach(id => resolvedSopIds.add(id));
                    
                    const activePolicies = sops.filter(p => resolvedSopIds.has(String(p.sopId).trim().toLowerCase()) && String(p.status).trim().toLowerCase() !== 'inactive');
                    
                    const followingPolicies = [];
                    const notFollowingPolicies = [];
                    const pendingPolicies = [];
                    
                    activePolicies.forEach(policy => {
                        const record = sopReadRecords.find(r => 
                            String(r.userEmail).trim().toLowerCase() === String(email).trim().toLowerCase() &&
                            String(r.weekCode).trim().toLowerCase() === String(selectedWeek).trim().toLowerCase() &&
                            String(r.sopId).trim().toLowerCase() === String(policy.sopId).trim().toLowerCase() &&
                            String(r.policyId).trim().toLowerCase() === String(policy.policyId).trim().toLowerCase()
                        );
                        
                        if (record) {
                            if (record.compliance === 'Following') {
                                followingPolicies.push({ ...policy, record });
                            } else if (record.compliance === 'Not Following') {
                                notFollowingPolicies.push({ ...policy, record });
                            } else {
                                pendingPolicies.push(policy);
                            }
                        } else {
                            pendingPolicies.push(policy);
                        }
                    });
                    
                    return {
                        headName: map.headName,
                        headEmail: map.headEmail,
                        deptName: map.deptName,
                        following: followingPolicies,
                        notFollowing: notFollowingPolicies,
                        pending: pendingPolicies,
                        total: activePolicies
                    };
                });
            }, [mappings, sops, sopMappings, sopReadRecords, selectedWeek, deptGroups, mdEmail]);

            // Save SOPs to spreadsheet or local state
            const saveSops = async (updatedSops) => {
                try {
                    if (isSandbox) {
                        setSops(updatedSops);
                        localStorage.setItem('pcil_sops', JSON.stringify(updatedSops));
                        showNotification('SOP policies updated in Sandbox local database!', 'success');
                    } else {
                        const headers = ['sopId', 'sopName', 'policyId', 'policyText', 'status'];
                        const values = [
                            headers,
                            ...updatedSops.map(s => [s.sopId, s.sopName, s.policyId, s.policyText, s.status])
                        ];
                        const tokenVal = await ensureValidToken();
                        const response = await fetch(
                            `https://sheets.googleapis.com/v4/spreadsheets/${CENTRAL_CONFIG_SPREADSHEET_ID}/values/SOPs!A:E?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${tokenVal}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ values })
                            }
                        );
                        if (response.ok) {
                            setSops(updatedSops);
                            localStorage.setItem('pcil_sops', JSON.stringify(updatedSops));
                            showNotification('SOP policies updated successfully in Google Sheets!', 'success');
                        } else {
                            throw new Error('Failed to update Google Sheet');
                        }
                    }
                } catch (err) {
                    console.error('[SOP Admin] Save policies failed:', err);
                    showNotification('Failed to save policies changes.', 'error');
                }
            };

            // Save SOP Mappings to spreadsheet or local state
            const saveSopMappings = async (updatedMappings) => {
                try {
                    if (isSandbox) {
                        setSopMappings(updatedMappings);
                        localStorage.setItem('pcil_sopMappings', JSON.stringify(updatedMappings));
                        showNotification('SOP mappings updated in Sandbox local database!', 'success');
                    } else {
                        const headers = ['targetId', 'type', 'sopId'];
                        const values = [
                            headers,
                            ...updatedMappings.map(m => [m.targetId, m.type, m.sopId])
                        ];
                        const tokenVal = await ensureValidToken();
                        const response = await fetch(
                            `https://sheets.googleapis.com/v4/spreadsheets/${CENTRAL_CONFIG_SPREADSHEET_ID}/values/SOPMappings!A:C?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${tokenVal}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ values })
                            }
                        );
                        if (response.ok) {
                            setSopMappings(updatedMappings);
                            localStorage.setItem('pcil_sopMappings', JSON.stringify(updatedMappings));
                            showNotification('SOP mappings updated successfully in Google Sheets!', 'success');
                        } else {
                            throw new Error('Failed to update Google Sheet');
                        }
                    }
                } catch (err) {
                    console.error('[SOP Admin] Save mappings failed:', err);
                    showNotification('Failed to save mappings changes.', 'error');
                }
            };

            const handleTextFormat = (formatType) => {
                const textarea = textareaRef.current;
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                let formatted = '';

                if (formatType === 'bold') {
                    formatted = text.substring(0, start) + '**' + text.substring(start, end) + '**' + text.substring(end);
                } else if (formatType === 'bullet') {
                    const lines = text.substring(start, end).split('\n');
                    const formattedLines = lines.map(line => line.startsWith('* ') ? line : `* ${line}`);
                    formatted = text.substring(0, start) + formattedLines.join('\n') + text.substring(end);
                }

                setEditingPolicy(prev => ({ ...prev, policyText: formatted }));
                setTimeout(() => {
                    textarea.focus();
                    textarea.setSelectionRange(start + 2, end + 2);
                }, 50);
            };

            // Group sops for policies editor list
            const groupedSops = React.useMemo(() => {
                const groups = {};
                sops.forEach(p => {
                    if (!groups[p.sopId]) {
                        groups[p.sopId] = { sopId: p.sopId, sopName: p.sopName, policies: [] };
                    }
                    groups[p.sopId].policies.push(p);
                });
                return Object.values(groups);
            }, [sops]);

            return (
                <div className="flex flex-col gap-6 w-full animate-slide-up">
                    {/* Header Controls */}
                    <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900 border border-slate-850 text-white rounded-3xl p-4 md:p-5 shadow-lg">
                        <div className="flex items-center gap-3">
                            <div className="h-10 w-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center">
                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </div>
                            <div>
                                <h2 className="text-base md:text-lg font-bold tracking-tight text-slate-100">
                                    SOP Management Dashboard
                                </h2>
                                <p className="text-[10px] text-slate-400 font-medium font-sans">
                                    Admin Controls & Compliance Audit Center
                                </p>
                            </div>
                        </div>

                        {/* Tabs Bar */}
                        <div className="flex items-center gap-2.5 w-full md:w-auto">
                            <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full md:w-auto">
                                <button
                                    onClick={() => setActiveTab('compliance')}
                                    className={`flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                        activeTab === 'compliance' ? 'bg-teal-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'
                                    }`}
                                >
                                    Summary Report
                                </button>
                                <button
                                    onClick={() => setActiveTab('policies')}
                                    className={`flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                        activeTab === 'policies' ? 'bg-teal-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'
                                    }`}
                                >
                                    Policy Editor
                                </button>
                                <button
                                    onClick={() => setActiveTab('mappings')}
                                    className={`flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                        activeTab === 'mappings' ? 'bg-teal-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'
                                    }`}
                                >
                                    SOP Mappings
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Content Section */}
                    {activeTab === 'compliance' && (
                        <div className="flex flex-col gap-5 animate-slide-up">
                            {/* Compliance Filters Panel */}
                            <div className="glass-panel p-4 rounded-3xl border border-slate-200/80 shadow-md flex items-center justify-between bg-white">
                                <span className="text-xs font-extrabold text-slate-800 uppercase tracking-tight">Select Audit Week</span>
                                <div className="flex items-center gap-2">
                                    <select

        // RC4 Encryption / Decryption Helper
        function rc4Cipher(key, str) {
            const s = [];
            let j = 0;
            let x;
            let res = '';
            for (let i = 0; i < 256; i++) {
                s[i] = i;
            }
            for (let i = 0; i < 256; i++) {
                j = (j + s[i] + key.charCodeAt(i % key.length)) % 256;
                x = s[i];
                s[i] = s[j];
                s[j] = x;
            }
            let i = 0;
            j = 0;
            for (let y = 0; y < str.length; y++) {
                i = (i + 1) % 256;
                j = (j + s[i]) % 256;
                x = s[i];
                s[i] = s[j];
                s[j] = x;
                res += String.fromCharCode(str.charCodeAt(y) ^ s[(s[i] + s[j]) % 256]);
            }
            return res;
        }

        // Date helper functions
        function parseExcelDate(val) {
            if (!val) return '';
            if (!isNaN(val) && String(val).trim() !== '') {
                const num = Number(val);
                // Excel 1900 leap year bug handler
                const date = new Date(Math.round((num - (num > 60 ? 25569 : 25568)) * 86400 * 1000));
                if (num % 1 !== 0) {
                    return formatDateTimeString(date);
                }
                return formatDateString(date);
            }
            return String(val);
        }

        // Format Date to DD-MMM-YYYY
        function formatDateString(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(date.getDate()).padStart(2, '0');
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function formatDateTimeString(date) {
            const dateStr = formatDateString(date);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${dateStr} ${hours}:${minutes}`;
        }

        // Helper to get YYYY-Www week code
        function getCurrentWeekCode(date = new Date()) {
            const tempDate = new Date(date.valueOf());
            // ISO week date standard: Thursday in current week decides the year
            tempDate.setDate(tempDate.getDate() + 4 - (tempDate.getDay() || 7));
            const yearStart = new Date(tempDate.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
            const pad = (val) => String(val).padStart(2, '0');
            return `${tempDate.getFullYear()}-W${pad(weekNo)}`;
        }

        function parseDateString(dateStr) {
            if (!dateStr) return new Date(0);
            const parts = String(dateStr).trim().split(/[\s\-\/]+/);
            if (parts.length >= 3) {
                let day = parseInt(parts[0], 10);
                let monthStr = parts[1];
                let year = parseInt(parts[2], 10);

                // Handle YYYY-MM-DD format
                if (parts[0].length === 4 && parts[2].length <= 2) {
                    day = parseInt(parts[2], 10);
                    year = parseInt(parts[0], 10);
                }

                // Try parsing month as a number (1-12)
                let monthIndex = parseInt(monthStr, 10) - 1;

                // Fallback to word-based month names if not a valid number
                if (isNaN(monthIndex) || monthIndex < 0 || monthIndex > 11) {
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    monthIndex = months.findIndex(m => m.toLowerCase() === monthStr.toLowerCase());
                }

                if (monthIndex !== -1 && !isNaN(day) && !isNaN(year)) {
                    const fullYear = year < 100 ? 2000 + year : year;
                    let hours = 0;
                    let minutes = 0;
                    if (parts.length >= 4) {
                        const timeParts = parts[3].split(':');
                        if (timeParts.length >= 2) {
                            hours = parseInt(timeParts[0], 10) || 0;
                            minutes = parseInt(timeParts[1], 10) || 0;
                        }
                    }
                    return new Date(fullYear, monthIndex, day, hours, minutes);
                }
            }
            const parsed = Date.parse(dateStr);
            return isNaN(parsed) ? new Date(0) : new Date(parsed);
        }

        // Cookie Helper Functions for session persistence
        function setCookie(name, value, expiresAt) {
            let expires = "";
            if (expiresAt) {
                const date = new Date(expiresAt);
                expires = "; expires=" + date.toUTCString();
            }
            let cookieStr = name + "=" + encodeURIComponent(JSON.stringify(value)) + expires + "; path=/; SameSite=Strict";
            if (window.location.protocol === 'https:') {
                cookieStr += "; Secure";
            }
            document.cookie = cookieStr;
        }

        // Retrieves and decodes parsed cookie data
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch (_) {
                        return null;
                    }
                }
            }
            return null;
        }

        function eraseCookie(name) {
            document.cookie = name + "=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; SameSite=Strict" + (window.location.protocol === 'https:' ? "; Secure" : "");
        }

        // Calculate pending elapsed time in Days, Hours & Minutes
        function getPendingElapsedTime(dateStr) {
            if (!dateStr) return null;
            const createdDate = parseDateString(dateStr);
            if (!createdDate || isNaN(createdDate.getTime()) || createdDate.getTime() === 0) return null;
            
            const now = new Date();
            const diffMs = now.getTime() - createdDate.getTime();
            if (diffMs <= 0) return "0m";
            
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const mins = diffMins % 60;
            
            const diffHours = Math.floor(diffMins / 60);
            const hours = diffHours % 24;
            
            const days = Math.floor(diffHours / 24);
            
            const parts = [];
            if (days > 0) {
                parts.push(`${days}d`);
            }
            if (hours > 0 || days > 0) {
                parts.push(`${hours}h`);
            }
            parts.push(`${mins}m`);
            
            return parts.join(' ');
        }

        // Parse input date string YYYY-MM-DD locally to avoid timezone issues
        function parseInputDate(dateStr) {
            if (!dateStr) return null;
            const parts = String(dateStr).split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
            return new Date(dateStr);
        }

        // Get current week/month/quarter period code for repeating directives
        function getPeriodCode(date, type, repetitionStr) {
            if (!date || isNaN(date.getTime())) return '';
            let mode = 'weekly'; // WSR default
            if (type === 'Reports') {
                const rep = String(repetitionStr).toLowerCase();
                if (rep === 'daily') mode = 'daily';
                else if (rep.includes('monthly')) mode = 'monthly';
                else if (rep.includes('quarterly')) mode = 'quarterly';
            }
            
            if (mode === 'daily') {
                return `${date.getFullYear()}-D${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;
            } else if (mode === 'weekly') {
                const tempDate = new Date(date.getTime());
                tempDate.setHours(0, 0, 0, 0);
                tempDate.setDate(tempDate.getDate() + 3 - (tempDate.getDay() + 6) % 7);
                const week1 = new Date(tempDate.getFullYear(), 0, 4);
                const weekNum = 1 + Math.round(((tempDate.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                return `${tempDate.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
            } else if (mode === 'monthly') {
                return `${date.getFullYear()}-M${String(date.getMonth() + 1).padStart(2, '0')}`;
            } else if (mode === 'quarterly') {
                const quarter = Math.floor(date.getMonth() / 3) + 1;
                return `${date.getFullYear()}-Q${quarter}`;
            }
            return '';
        }

        // Determine if today matches the scheduled day of the week or month for WSR / Reports
        function isDueToday(type, repetitionStr) {
            if (!repetitionStr) return false;
            const today = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayDayName = days[today.getDay()].toLowerCase();
            const todayDateNum = today.getDate();
            
            const rep = String(repetitionStr).trim().toLowerCase();
            
            if (type === 'WSR') {
                return rep === todayDayName;
            } else if (type === 'Reports') {
                if (rep === 'daily') {
                    return true;
                }
                if (rep.startsWith('weekly')) {
                    const parts = rep.split('-');
                    if (parts.length >= 2) {
                        const targetDay = parts[1].trim();
                        return targetDay === todayDayName;
                    }
                } else if (rep.startsWith('monthly')) {
                    const parts = rep.split('-');
                    if (parts.length >= 2) {
                        const targetDate = parseInt(parts[1].trim(), 10);
                        return targetDate === todayDateNum;
                    }
                } else if (rep.startsWith('quarterly')) {
                    const parts = rep.split('-');
                    if (parts.length >= 2) {
                        const targetDate = parseInt(parts[1].trim(), 10);
                        const month = today.getMonth();
                        const isStartMonthOfQuarter = (month % 3 === 0);
                        return isStartMonthOfQuarter && (targetDate === todayDateNum);
                    }
                }
            }
            return false;
        }

        // Convert column index to Excel letter (A, B... Z, AA...)
        function getColumnLetter(index) {
            let temp = index;
            let letter = '';
            while (temp >= 0) {
                letter = String.fromCharCode((temp % 26) + 65) + letter;
                temp = Math.floor(temp / 26) - 1;
            }
            return letter;
        }

        // Shared utility to correctly merge directive updates with original row values at mapped column indices
        function assembleUpdatedRow(directive, updatedFields) {
            const indices = directive.columnIndices || {
                dateIdx: 0,
                typeIdx: 1,
                descIdx: 2,
                priorityIdx: 3,
                targetDateIdx: 4,
                verificationIdx: 5,
                statusIdx: 6,
                remarkIdx: 7,
                delegatedIdx: 8,
                completionDateIdx: 9,
                repetitionIdx: 10
            };

            const originalValues = directive.originalRowValues || [];
            const maxIdx = Math.max(...Object.values(indices).filter(idx => typeof idx === 'number'));
            const updatedRowValues = [...originalValues];
            
            // Ensure the array has enough elements to cover all indices
            while (updatedRowValues.length <= maxIdx) {
                updatedRowValues.push('');
            }
            
            // Replace undefined elements with empty string
            for (let i = 0; i < updatedRowValues.length; i++) {
                if (updatedRowValues[i] === undefined) {
                    updatedRowValues[i] = '';
                }
            }

            // Update date if changed
            if (indices.dateIdx !== -1 && updatedFields.hasOwnProperty('date')) {
                const newDateObj = parseInputDate(updatedFields.date);
                const oldDateObj = parseDateString(directive.date);
                let dateVal = '';
                if (newDateObj) {
                    // Check if calendar dates are the same
                    const isSameDate = oldDateObj && 
                        newDateObj.getFullYear() === oldDateObj.getFullYear() &&
                        newDateObj.getMonth() === oldDateObj.getMonth() &&
                        newDateObj.getDate() === oldDateObj.getDate();
                    
                    if (isSameDate) {
                        // Preserve original date/time value exactly as it was
                        dateVal = directive.date;
                    } else {
                        // If date is different, preserve original time if it exists
                        const hasTime = directive.date && String(directive.date).trim().split(/[\s\-\/]+/).length >= 4;
                        if (hasTime) {
                            newDateObj.setHours(oldDateObj.getHours());
                            newDateObj.setMinutes(oldDateObj.getMinutes());
                            dateVal = formatDateTimeString(newDateObj);
                        } else {
                            dateVal = formatDateString(newDateObj);
                        }
                    }
                }
                updatedRowValues[indices.dateIdx] = dateVal || '';
            } else if (indices.dateIdx !== -1 && !updatedRowValues[indices.dateIdx]) {
                updatedRowValues[indices.dateIdx] = directive.date || '';
            }

            if (indices.typeIdx !== -1 && !updatedRowValues[indices.typeIdx]) {
                updatedRowValues[indices.typeIdx] = directive.type || '';
            }

            // Update description if changed (with Option A Report Name prefix for Reports type)
            if (indices.descIdx !== -1) {
                const currentType = updatedFields.type || directive.type;
                if (currentType === 'Reports') {
                    const finalReportName = updatedFields.hasOwnProperty('reportName') ? (updatedFields.reportName || '') : (directive.reportName || '');
                    const finalDesc = updatedFields.hasOwnProperty('description') ? (updatedFields.description || '') : (directive.description || '');
                    updatedRowValues[indices.descIdx] = `Report Name: ${finalReportName}\n${finalDesc}`;
                } else {
                    if (updatedFields.hasOwnProperty('description')) {
                        updatedRowValues[indices.descIdx] = updatedFields.description || '';
                    } else if (!updatedRowValues[indices.descIdx]) {
                        updatedRowValues[indices.descIdx] = directive.description || '';
                    }
                }
            }

            if (indices.repetitionIdx !== -1 && !updatedRowValues[indices.repetitionIdx]) {
                updatedRowValues[indices.repetitionIdx] = directive.repetition || '';
            }

            // Update priority if changed
            if (indices.priorityIdx !== -1 && updatedFields.hasOwnProperty('priority')) {
                updatedRowValues[indices.priorityIdx] = updatedFields.priority || '';
            }

            // Update targetDate if changed
            if (indices.targetDateIdx !== -1 && updatedFields.hasOwnProperty('targetDate')) {
                const targetDateVal = updatedFields.targetDate ? formatDateString(parseInputDate(updatedFields.targetDate)) : '';
                updatedRowValues[indices.targetDateIdx] = targetDateVal || '';
            }

            // Update verification
            if (indices.verificationIdx !== -1 && updatedFields.hasOwnProperty('verification')) {
                updatedRowValues[indices.verificationIdx] = updatedFields.verification || '';
            }

            // Update status (include completion timestamps for WSR and Reports)
            if (indices.statusIdx !== -1 && updatedFields.hasOwnProperty('status')) {
                let statusVal = updatedFields.status || '';
                if (directive.type === 'WSR' || directive.type === 'Reports') {
                    if (statusVal === 'Completed') {
                        const datePart = directive.completionDate || formatDateTimeString(new Date());
                        statusVal = `Completed (${datePart})`;
                    } else if (statusVal === 'Checked & Confirmed') {
                        const datePart = directive.completionDate || formatDateTimeString(new Date());
                        statusVal = `Checked & Confirmed (${datePart})`;
                    }
                }
                updatedRowValues[indices.statusIdx] = statusVal;
            }

            // Update remark
            if (indices.remarkIdx !== -1 && updatedFields.hasOwnProperty('remark')) {
                updatedRowValues[indices.remarkIdx] = updatedFields.remark || '';
            }

            // Update delegatedTo
            if (indices.delegatedIdx !== -1 && updatedFields.hasOwnProperty('delegatedTo')) {
                updatedRowValues[indices.delegatedIdx] = updatedFields.delegatedTo || '';
            }

            // Update repetition
            if (indices.repetitionIdx !== -1 && updatedFields.hasOwnProperty('repetition')) {
                updatedRowValues[indices.repetitionIdx] = updatedFields.repetition || '';
            }

            // Update completion date
            if (indices.completionDateIdx !== -1) {
                if (updatedFields.hasOwnProperty('completionDate')) {
                    updatedRowValues[indices.completionDateIdx] = updatedFields.completionDate || '';
                } else if (updatedFields.hasOwnProperty('status') || updatedFields.hasOwnProperty('verification')) {
                    let newCompletionDate = directive.completionDate;
                    const newStatus = updatedFields.hasOwnProperty('status') ? updatedFields.status : directive.status;
                    const isCompletedStatus = newStatus === 'Completed' || newStatus === 'Checked & Confirmed';

                    if (updatedFields.hasOwnProperty('status')) {
                        if (isCompletedStatus) {
                            const prevStatus = directive.status;
                            const wasCompleted = prevStatus === 'Completed' || prevStatus === 'Checked & Confirmed';
                            if (!wasCompleted || !newCompletionDate) {
                                newCompletionDate = formatDateTimeString(new Date());
                            }
                        } else {
                            newCompletionDate = '';
                        }
                    }

                    const newVerification = updatedFields.hasOwnProperty('verification') ? updatedFields.verification : directive.verification;
                    if (newVerification === 'Done' && newStatus !== 'Checked & Confirmed') {
                        if (!newCompletionDate) {
                            newCompletionDate = formatDateTimeString(new Date());
                        }
                    }
                    updatedRowValues[indices.completionDateIdx] = newCompletionDate || '';
                }
            }

            return updatedRowValues;
        }

        // Fetch wrapper that handles status code 429 and retries with progressive exponential backoff
        async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
            try {
                const method = (options.method || 'GET').toUpperCase();
                if (method === 'GET' && !options.hasOwnProperty('cache')) {
                    options.cache = 'no-store';
                }
                const response = await fetch(url, options);
                if (response.status === 429 && retries > 0) {
                    console.warn(`[Quota Optimization] Rate limited (429). Retrying in ${delay}ms... (${retries} retries left)`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                return response;
            } catch (err) {
                if (retries > 0) {
                    console.warn(`[Quota Optimization] Fetch error. Retrying in ${delay}ms... (${retries} retries left)`, err);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw err;
            }
        }

                            const matchedGroupKey = Object.keys(groupToDepts).find(gKey => gKey.trim().toLowerCase() === String(m.targetId).trim().toLowerCase());
                            const deptIds = matchedGroupKey ? groupToDepts[matchedGroupKey] : [];
                            deptIds.forEach(dId => {
                                const targetMapping = fetchedMappings.find(map => String(map.id).trim().toLowerCase() === String(dId).trim().toLowerCase());
                                if (targetMapping) {
                                    if (!targetMapping.sops.some(s => String(s.id).trim().toLowerCase() === String(sopObject.id).trim().toLowerCase())) {
                                        targetMapping.sops.push({ ...sopObject });
                                    }
                                }
                            });
                        }
                    });
                    
                    // 6. Parse SOPReadRecords
                    const fetchedReadRecords = [];
                    if (readRecordsRange && readRecordsRange.values && readRecordsRange.values.length > 0) {
                        const rows = readRecordsRange.values;
                        const headers = rows[0].map(h => String(h).trim());
                        const timestampIdx = headers.findIndex(h => h.toLowerCase() === 'timestamp');
                        const emailIdx = headers.findIndex(h => h.toLowerCase() === 'user email' || h.toLowerCase() === 'useremail' || h.toLowerCase() === 'email');
                        const deptIdx = headers.findIndex(h => h.toLowerCase() === 'department' || h.toLowerCase() === 'dept');
                        const sopIdIdx = headers.findIndex(h => h.toLowerCase() === 'sop id' || h.toLowerCase() === 'sopid');
                        const policyIdIdx = headers.findIndex(h => h.toLowerCase() === 'policy id' || h.toLowerCase() === 'policyid');
                        const weekIdx = headers.findIndex(h => h.toLowerCase() === 'week code' || h.toLowerCase() === 'weekcode');
                        const statusIdx = headers.findIndex(h => h.toLowerCase() === 'compliance status' || h.toLowerCase() === 'compliancestatus' || h.toLowerCase() === 'status');
                        const reasonIdx = headers.findIndex(h => h.toLowerCase() === 'deviation reason' || h.toLowerCase() === 'deviationreason' || h.toLowerCase() === 'reason');
                        
                        if (emailIdx !== -1 && weekIdx !== -1 && policyIdIdx !== -1) {
                            for (let i = 1; i < rows.length; i++) {
                                const row = rows[i];
                                fetchedReadRecords.push({
                                    timestamp: timestampIdx !== -1 && row[timestampIdx] !== undefined ? String(row[timestampIdx]).trim() : '',
                                    userEmail: row[emailIdx] !== undefined ? String(row[emailIdx]).trim().toLowerCase() : '',
                                    department: deptIdx !== -1 && row[deptIdx] !== undefined ? String(row[deptIdx]).trim() : '',
                                    sopId: sopIdIdx !== -1 && row[sopIdIdx] !== undefined ? String(row[sopIdIdx]).trim() : '',
                                    policyId: row[policyIdIdx] !== undefined ? String(row[policyIdIdx]).trim() : '',
                                    weekCode: row[weekIdx] !== undefined ? String(row[weekIdx]).trim() : '',
                                    compliance: statusIdx !== -1 && row[statusIdx] !== undefined ? String(row[statusIdx]).trim() : '',
                                    reason: reasonIdx !== -1 && row[reasonIdx] !== undefined ? String(row[reasonIdx]).trim() : ''
                                });
                            }
                        }
                    }
                    
                    // 7. Save to localStorage & update states only if they have changed
                    if (fetchedClientId && fetchedClientId !== clientId) {
                        setClientId(fetchedClientId);
                        localStorage.setItem('pcil_clientId', fetchedClientId);
                    }
                    if (fetchedMdEmail && fetchedMdEmail !== mdEmail) {
                        setMdEmail(fetchedMdEmail);
                        localStorage.setItem('pcil_mdEmail', fetchedMdEmail);
                    }
                    if (fetchedMdSopDocId !== undefined && fetchedMdSopDocId !== mdSopDocId) {
                        setMdSopDocId(fetchedMdSopDocId);
                        localStorage.setItem('pcil_mdSopDocId', fetchedMdSopDocId);
                    }
                    if (fetchedMappings.length > 0) {
                        const newMappingsStr = JSON.stringify(fetchedMappings);
                        const oldMappingsStr = localStorage.getItem('pcil_mappings') || '';
                        if (newMappingsStr !== oldMappingsStr) {
                            setMappings(fetchedMappings);
                            localStorage.setItem('pcil_mappings', newMappingsStr);
                        }
                    }
                    if (fetchedSops.length > 0) {
                        const newSopsStr = JSON.stringify(fetchedSops);
                        const oldSopsStr = localStorage.getItem('pcil_sops') || '';
                        if (newSopsStr !== oldSopsStr) {
                            setSops(fetchedSops);
                            localStorage.setItem('pcil_sops', newSopsStr);
                        }
                    }
                    if (mappingsSopRange && mappingsSopRange.values) {
                        const newSopMappingsStr = JSON.stringify(fetchedSopMappings);
                        const oldSopMappingsStr = localStorage.getItem('pcil_sopMappings') || '';
                        if (newSopMappingsStr !== oldSopMappingsStr) {
                            setSopMappings(fetchedSopMappings);
                            localStorage.setItem('pcil_sopMappings', newSopMappingsStr);
                        }
                    }
                    if (groupsRange && groupsRange.values) {
                        const newDeptGroupsStr = JSON.stringify(fetchedDeptGroups);
                        const oldDeptGroupsStr = localStorage.getItem('pcil_deptGroups') || '';
                        if (newDeptGroupsStr !== oldDeptGroupsStr) {
                            setDeptGroups(fetchedDeptGroups);
                            localStorage.setItem('pcil_deptGroups', newDeptGroupsStr);
                        }
                    }
                    const newReadRecordsStr = JSON.stringify(fetchedReadRecords);
                    const oldReadRecordsStr = localStorage.getItem('pcil_sopReadRecords') || '';
                    if (newReadRecordsStr !== oldReadRecordsStr) {
                        setSopReadRecords(fetchedReadRecords);
                        localStorage.setItem('pcil_sopReadRecords', newReadRecordsStr);
                    }

                    // 7. Parse & Enforce Permissions
                    let parsedPermissions = {
                        CanViewAllSOPs: false,
                        CanCreateSOPs: false,
                        CanEditSOPs: false,
                        CanDeleteSOPs: false,
                        CanCreateMappingsGroups: false,
                        CanEditMappingsGroups: false,
                        CanDeletMappingsGroups: false,
                        CanCreateMappings: false,
                        CanDeleteMappings: false,
                        CanIssueDirectives: false,
                        CanVerifyDirectives: false,
                        CanEditDirectives: false,
                        CanDeleteDirectives: false
                    };
                    const userEmail = auth?.email?.toLowerCase() || '';
                    const mdEmailsList = fetchedMdEmail.split(',').map(e => e.trim().toLowerCase());
                    let isUserInPermSheet = false;
                    
                    if (permissionsRange && permissionsRange.values && permissionsRange.values.length > 0) {
                        const rows = permissionsRange.values;
                        const emailsRow = rows[0] || [];
                        const colIdx = emailsRow.findIndex((val, idx) => idx > 0 && String(val).trim().toLowerCase() === userEmail);
                        
                        if (colIdx !== -1) {
                            isUserInPermSheet = true;
                            for (let r = 1; r < rows.length; r++) {
                                const row = rows[r];
                                if (row && row[0]) {
                                    const key = String(row[0]).trim();
                                    const rawVal = row[colIdx] ? String(row[colIdx]).trim() : '';
                                    let val;
                                    if (rawVal.toUpperCase() === 'TRUE') {
                                        val = true;
                                    } else if (rawVal.toUpperCase() === 'FALSE') {
                                        val = false;
                                    } else if (rawVal) {
                                        val = rawVal;
                                    } else {
                                        val = false;
                                    }
                                    if (key in parsedPermissions) {
                                        parsedPermissions[key] = val;
                                    }
                                }
                            }
                        } else {
                            if (mdEmailsList.includes(userEmail)) {
                                Object.keys(parsedPermissions).forEach(k => {
                                    parsedPermissions[k] = true;
                                });
                            }
                        }
                    } else {
                        if (mdEmailsList.includes(userEmail)) {
                            Object.keys(parsedPermissions).forEach(k => {
                                parsedPermissions[k] = true;
                            });
                        }
                    }
                    
                    const newPermissionsStr = JSON.stringify(parsedPermissions);
                    const oldPermissionsStr = localStorage.getItem('pcil_userPermissions') || '';
                    if (newPermissionsStr !== oldPermissionsStr) {
                        setUserPermissions(parsedPermissions);
                        localStorage.setItem('pcil_userPermissions', newPermissionsStr);
                    }

                    const oldIsInPermSheet = localStorage.getItem('pcil_isInPermissionsSheet') === 'true';
                    if (isUserInPermSheet !== oldIsInPermSheet) {
                        setIsInPermissionsSheet(isUserInPermSheet);
                        localStorage.setItem('pcil_isInPermissionsSheet', String(isUserInPermSheet));
                    }
                    
                    console.log('[Config] Configuration loaded. Mappings:', fetchedMappings.length, 'SOPs:', fetchedSops.length);
                    return fetchedMappings;
                } catch (err) {
                    console.error('[Config] Failed to fetch central configuration:', err);
                    showNotification('Using cached configuration. Failed to update from server.', 'warning');
                    return null;
                }
            };

            // Close modals on Escape key press
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setSelectedDirective(null);
                        setEditingDirective(null);
                        setIsDispatchOpen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // Capture PWA custom install prompt event
            React.useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    console.log("[PWA] Custom install prompt captured!");
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;

                const dataStartRow = 2; // Skip heading (Row 1) and titles (Row 2)
                const parsedDirectives = [];
                
                for (let i = dataStartRow; i < values.length; i++) {
                    const row = values[i];
                    const isRowEmpty = !row || row.length === 0 || row.every(cell => cell === undefined || String(cell).trim() === "");
                    if (isRowEmpty) continue;
                    
                    const sNo = row[0] || '';
                    const particulars = row[1] || '';
                    const parsedParticulars = extractCreatedBy(particulars);
                    const rawStatus = row[2] || '';
                    
                    let parsedStatus = String(rawStatus).trim();
                    let parsedCompletionDate = '';
                    let parsedRemark = '';
                    
                    // Extract notification tag first to prevent clashing with status matching
                    const notifiedMatch = parsedStatus.match(/\[Notified: (.*?)\]/);
                    if (notifiedMatch) {
                        parsedRemark = notifiedMatch[0]; // e.g. "[Notified: 2026-W23]"
                        parsedStatus = parsedStatus.replace(/\[Notified: (.*?)\]/, '').trim();
                    }
                    
                    if (parsedStatus.startsWith('Completed')) {
                        const match = parsedStatus.match(/Completed \((.*?)\)/);
                        if (match) {
                            parsedCompletionDate = match[1];
                        }
                        parsedStatus = 'Completed';
                    } else if (parsedStatus.startsWith('Checked & Confirmed')) {
                        const match = parsedStatus.match(/Checked & Confirmed \((.*?)\)/);
                        if (match) {
                            parsedCompletionDate = match[1];
                        }
                        parsedStatus = 'Checked & Confirmed';
                    }
                    
                    const parsedRepetition = 'Monday';
                    
                    // Dynamic status reset for repeating WSR
                    if (parsedCompletionDate) {
                        const completedPeriod = getPeriodCode(parseDateString(parsedCompletionDate), 'WSR', parsedRepetition);
                        const currentPeriod = getPeriodCode(new Date(), 'WSR', parsedRepetition);
                        if (completedPeriod && completedPeriod !== currentPeriod) {
                            parsedStatus = 'Pending';
                            parsedCompletionDate = '';
                        }
                    }
                    
                    parsedDirectives.push({
                        excelRowNumber: i + 1,
                        spreadsheetId: mapping.spreadsheetId,
                        sheetTabName: 'WSR',
                        departmentId: mapping.id,
                        departmentName: mapping.deptName,
                        deptName: mapping.deptName,
                        headName: mapping.headName,
                        headEmail: mapping.headEmail,
                        
                        date: '',
                        type: 'WSR',
                        description: parsedParticulars.text,
                        priority: 'Normal',
                        targetDate: '',
                        verification: parsedStatus === 'Completed' || parsedStatus === 'Checked & Confirmed' ? 'Done' : 'Pending',
                        status: parsedStatus || 'Pending',
                        remark: parsedRemark,
                        delegatedTo: '',
                        completionDate: parsedCompletionDate,
                        repetition: parsedRepetition,
                        createdBy: parsedParticulars.createdBy,
                        
                        columnIndices: {
                            dateIdx: -1,
                            typeIdx: -1,
                            descIdx: 1,
                            priorityIdx: -1,
                            targetDateIdx: -1,
                            verificationIdx: -1,
                            statusIdx: 2,
                            remarkIdx: -1,
                            delegatedIdx: -1,
                            completionDateIdx: -1,
                            repetitionIdx: -1
                        },
                        originalRowValues: row
                    });
                }
                return parsedDirectives;
            };

            // Write a new directive (MD dispatch)
            const handleDispatchSubmit = async (e) => {
                e.preventDefault();
                if (!dispatchDeptId) {
                    showNotification('Please select a recipient department.', 'error');
                    return;
                }
                
                const targetDept = mappings.find(m => m.id === dispatchDeptId);
                if (!targetDept) return;

                setDispatchLoading(true);
                const todayStr = formatDateTimeString(new Date());
                const targetDateStr = dispatchTargetDate ? formatDateString(parseInputDate(dispatchTargetDate)) : '';
                
                let dispatchRepetitionValue = '';
                if (dispatchType === 'WSR') {
                    dispatchRepetitionValue = dispatchWsrDay;
                } else if (dispatchType === 'Reports') {
                    if (dispatchReportTimeline === 'On Event') {
                        dispatchRepetitionValue = 'On Event';
                    } else if (dispatchReportTimeline === 'Daily') {
                        dispatchRepetitionValue = 'Daily';
                    } else {
                        dispatchRepetitionValue = `${dispatchReportTimeline} - ${dispatchReportDay}`;
                    }
                } else if (dispatchType === 'Instruction') {
                    dispatchRepetitionValue = dispatchInstructionType;
                }

                const userEmailAddr = auth?.email?.toLowerCase() || '';
                const creatorTag = userEmailAddr ? `\n\n[CreatedBy: ${userEmailAddr}]` : '';

                let activeTabName;
                let appendValues;

                if (dispatchType === 'WSR') {
                    activeTabName = 'WSR';
                    const deptWsrs = directives.filter(d => d.departmentId === targetDept.id && d.type === 'WSR');
                    const nextSNo = deptWsrs.length + 1;
                    appendValues = [nextSNo, dispatchDesc + creatorTag, 'Pending'];
                } else {
                    activeTabName = targetDept.sheetTabName || 'Master Data';
                    let finalDesc = dispatchDesc;
                    if (dispatchType === 'Reports') {
                        finalDesc = `Report Name: ${dispatchReportName}\n${dispatchDesc}`;
                    }
                    appendValues = [
                        todayStr,
                        dispatchType,
                        finalDesc + creatorTag,
                        dispatchPriority,
                        dispatchType === 'Reports' ? '' : targetDateStr,
                        'Pending',     // Verification
                        'Not Seen',    // Status
                        '',            // Remark
                        '',            // Delegated To
                        '',            // Completion Date
                        dispatchRepetitionValue
                    ];
                }

                if (isSandbox) {
                    // Sandbox writing
                    if (dispatchType === 'WSR') {
                        const targetKey = targetDept.spreadsheetId + "_WSR";
                        const existingRows = mockDb[targetKey] || [
                            ["Weekly Status Report\n\nSubmited By:_________________                      Sign: _________________                       Date: _______________"],
                            ["S.No.", "Particulars", "Status"]
                        ];
                        const nextSNo = existingRows.length - 1;
                        const newRow = [nextSNo, dispatchDesc + creatorTag, 'Pending'];
                        const updatedRows = [...existingRows, newRow];
                        setMockDb(prev => ({
                            ...prev,
                            [targetKey]: updatedRows
                        }));
                    } else {
                        const existingRows = mockDb[targetDept.spreadsheetId] || [
                            ["Date", "Type", "Description", "Priority", "Target Date", "Verification", "Status", "Remark", "Delegated To", "Completion Date", "Repetition"]
                        ];
                        const updatedRows = [...existingRows, appendValues];
                        setMockDb(prev => ({
                            ...prev,
                            [targetDept.spreadsheetId]: updatedRows
                        }));
                    }
                    
                    setDispatchDesc('');
                    setDispatchTargetDate('');
                    setDispatchWsrDay('Monday');
                    setDispatchReportTimeline('Weekly');
                    setDispatchReportDay('Monday');
                    setDispatchReportName('');
                    setDispatchInstructionType('Temporary');
                    
                    showNotification(`Directive successfully submitted to ${targetDept.headName} (Sandbox Mode)`, 'success');
                    showNotification(`Notification email simulated to ${targetDept.headEmail}`, 'info');
                    setDispatchSuccess(true);
                    setTimeout(() => {
                        setDispatchSuccess(false);
                        setIsDispatchOpen(false);
                    }, 1200);
                    setDispatchLoading(false);
                    // Reload data
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                // Google Sheets API append request
                if (!isSandbox) {
                    try {
                        const tokenVal = await ensureValidToken();
                        if (!tokenVal) {
                            setDispatchLoading(false);
                            return;
                        }
                    } catch (err) {
                        setDispatchLoading(false);
                        return;
                    }
                }
                try {
                    const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                    const response = await fetchWithRetry(
                        `https://sheets.googleapis.com/v4/spreadsheets/${targetDept.spreadsheetId}/values/${encodeURIComponent(quotedTab)}!A:A:append?valueInputOption=USER_ENTERED`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [appendValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        let errMsg = '';
                        try {
                            const errData = await response.json();
                            errMsg = errData?.error?.message || response.statusText || '';
                        } catch (_) {
                            errMsg = await response.text() || response.statusText || '';
                        }
                        throw new Error(`Failed to append row (Error ${response.status}): ${errMsg}`);
                    }

                    const desc = dispatchDesc;
                    const priority = dispatchPriority;
                    const targetDate = targetDateStr;

                    setDispatchDesc('');
                    setDispatchTargetDate('');
                    setDispatchWsrDay('Monday');
                    setDispatchReportTimeline('Weekly');
                    setDispatchReportDay('Monday');
                    setDispatchReportName('');
                    setDispatchInstructionType('Temporary');
                    
                    showNotification(`Directive successfully submitted to ${targetDept.headName}!`, 'success');
                    setDispatchSuccess(true);
                    setTimeout(() => {
                        setDispatchSuccess(false);
                        setIsDispatchOpen(false);
                    }, 1200);

                    // Send email notification via Gmail API
                    sendGmailNotification(
                        targetDept.headEmail,
                        targetDept.headName,
                        targetDept.deptName,
                        desc,
                        priority,
                        targetDate
                    );

                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Dispatch failed: ' + err.message, 'error');
                } finally {
                    setDispatchLoading(false);
                }
            };

            // Save row updates (Status, Remark, Delegated To, Verification etc.)
            const handleUpdateRow = async (updatedFields) => {
                if (!editingDirective) return;
                setEditLoading(true);

                const currentDirective = editingDirective;
                const excelRowNumber = currentDirective.excelRowNumber;
                
                // Assemble the full updated row dynamically
                const updatedRowValues = assembleUpdatedRow(currentDirective, updatedFields);

                const newStatus = updatedFields.hasOwnProperty('status') ? updatedFields.status : currentDirective.status;
                const newRemark = updatedFields.hasOwnProperty('remark') ? updatedFields.remark : currentDirective.remark;

                if (isSandbox) {
                    // Sandbox update
                    const sheetId = currentDirective.sheetTabName === 'WSR' ? `${currentDirective.spreadsheetId}_WSR` : currentDirective.spreadsheetId;
                    const sheetRows = [...(mockDb[sheetId] || [])];
                    sheetRows[excelRowNumber - 1] = updatedRowValues;
                    
                    setMockDb(prev => ({
                        ...prev,
                        [sheetId]: sheetRows
                    }));

                    setEditingDirective(null);
                    showNotification('Directive updated successfully (Sandbox Mode)', 'success');

                    // Notify MD in Sandbox Mode
                    const isUrgent = currentDirective.priority === 'Urgent' || currentDirective.priority === 'Very Urgent';
                    const isStatusChangedToNotify = (newStatus === 'On Hold' || newStatus === 'Completed' || newStatus === 'Checked & Confirmed') && currentDirective.status !== newStatus;
                    if (isUrgent && isStatusChangedToNotify && !effectivePermissions.CanVerifyDirectives) {
                        showNotification(`Notification email simulated to MD sir (${mdEmail})`, 'info');
                    }

                    setEditLoading(false);
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                // Google Sheets API update row request
                if (!isSandbox) {
                    try {
                        const tokenVal = await ensureValidToken();
                        if (!tokenVal) {
                            setEditLoading(false);
                            return;
                        }
                    } catch (err) {
                        setEditLoading(false);
                        return;
                    }
                }
                try {
                    const activeTabName = currentDirective.sheetTabName || 'Master Data';
                    const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                    const response = await fetchWithRetry(
                        `https://sheets.googleapis.com/v4/spreadsheets/${currentDirective.spreadsheetId}/values/${encodeURIComponent(quotedTab)}!A${excelRowNumber}?valueInputOption=USER_ENTERED`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [updatedRowValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        let errMsg = '';
                        try {
                            const errData = await response.json();
                            errMsg = errData?.error?.message || response.statusText || '';
                        } catch (_) {
                            errMsg = response.statusText || '';
                        }
                        throw new Error(`Failed to update row (Error ${response.status}): ${errMsg}`);
                    }

                    setEditingDirective(null);
                    showNotification('Directive updated successfully!', 'success');

                    // Notify MD in Production Mode
                    const isUrgent = currentDirective.priority === 'Urgent' || currentDirective.priority === 'Very Urgent';
                    const isStatusChangedToNotify = (newStatus === 'On Hold' || newStatus === 'Completed' || newStatus === 'Checked & Confirmed') && currentDirective.status !== newStatus;
                    if (isUrgent && isStatusChangedToNotify && !effectivePermissions.CanVerifyDirectives) {
                        sendMDStatusNotification(mdEmail, currentDirective, newStatus, newRemark);
                    }

                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Update failed: ' + err.message, 'error');
                } finally {
                    setEditLoading(false);
                }
            };

            // Shortcut MD Actions: Verify, Rework Required, Reset, and Delete
            const handleQuickAudit = async (directive, auditAction) => {
                let updatedFields = {};
                if (auditAction === 'verify') {
                    updatedFields = {
                        verification: 'Verified',
                        status: 'Checked & Confirmed',
                        completionDate: directive.completionDate || formatDateTimeString(new Date())
                    };
                } else if (auditAction === 'rework') {
                    updatedFields = {
                        verification: 'Rework Required',
                        status: 'In Progress'
                    };
                } else if (auditAction === 'reset') {
                    updatedFields = {
                        verification: 'Pending',
                        status: directive.type === 'WSR' ? 'Pending' : 'In Progress',
                        completionDate: ''
                    };
                } else if (auditAction === 'delete') {
                    updatedFields = {
                        status: 'Deleted'
                    };
                }

                setLoading(true);
                // Create temporary edit context to reuse update logic
                setEditingDirective(directive);
                
                const excelRowNumber = directive.excelRowNumber;
                
                // Assemble the full updated row dynamically
                const updatedRowValues = assembleUpdatedRow(directive, updatedFields);

                if (isSandbox) {
                    const sheetId = directive.sheetTabName === 'WSR' ? `${directive.spreadsheetId}_WSR` : directive.spreadsheetId;
                    const sheetRows = [...(mockDb[sheetId] || [])];
                    sheetRows[excelRowNumber - 1] = updatedRowValues;
                    
                    setMockDb(prev => ({
                        ...prev,
                        [sheetId]: sheetRows
                    }));

                    setEditingDirective(null);
                    showNotification(auditAction === 'delete' ? 'Directive deleted successfully (Sandbox Mode)' : `Directive audited: ${auditAction === 'verify' ? 'Verified' : auditAction === 'rework' ? 'Rework Required' : 'Reset'} (Sandbox)`, 'success');
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                if (!isSandbox) {
                    try {
                        const tokenVal = await ensureValidToken();
                        if (!tokenVal) {
                            setLoading(false);
                            setEditingDirective(null);
                            return;
                        }
                    } catch (err) {
                        setLoading(false);
                        setEditingDirective(null);
                        return;
                    }
                }
                try {
                    const activeTabName = directive.sheetTabName || 'Master Data';
                    const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                    const response = await fetchWithRetry(
                        `https://sheets.googleapis.com/v4/spreadsheets/${directive.spreadsheetId}/values/${encodeURIComponent(quotedTab)}!A${excelRowNumber}?valueInputOption=USER_ENTERED`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [updatedRowValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        let errMsg = '';
                        try {
                            const errData = await response.json();
                            errMsg = errData?.error?.message || response.statusText || '';
                        } catch (_) {
                            errMsg = response.statusText || '';
                        }
                        throw new Error(`Failed to audit row (Error ${response.status}): ${errMsg}`);
                    }

                    // Format row red on delete in Google Sheets
                    if (auditAction === 'delete') {
                        try {
                            const metaResponse = await fetchWithRetry(
                                `https://sheets.googleapis.com/v4/spreadsheets/${directive.spreadsheetId}?fields=sheets(properties(sheetId,title))`,
                                {
                                    headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                                }
                            );
                            let sheetGridId = null;
                            if (metaResponse.ok) {
                                const metaData = await metaResponse.json();
                                const sheet = metaData.sheets.find(s => s.properties.title === activeTabName);
                                if (sheet) {
                                    sheetGridId = sheet.properties.sheetId;
                                }
                            }

                            if (sheetGridId !== null) {
                                const rowIndex = excelRowNumber - 1;
                                const batchUpdateUrl = `https://sheets.googleapis.com/v4/spreadsheets/${directive.spreadsheetId}:batchUpdate`;
                                const batchUpdateBody = {
                                    requests: [
                                        {
                                            repeatCell: {
                                                range: {
                                                    sheetId: sheetGridId,
                                                    startRowIndex: rowIndex,
                                                    endRowIndex: rowIndex + 1,
                                                    startColumnIndex: 0,
                                                    endColumnIndex: updatedRowValues.length
                                                },
                                                cell: {
                                                    userEnteredFormat: {
                                                        backgroundColor: {
                                                            red: 1.0,
                                                            green: 0.8,
                                                            blue: 0.8
                                                        }
                                                    }
                                                },
                                                fields: 'userEnteredFormat.backgroundColor'
                                            }
                                        }
                                    ]
                                };

                                await fetchWithRetry(batchUpdateUrl, {
                                    method: 'POST',
                                    headers: {
                                        'Authorization': `Bearer ${auth.accessToken}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(batchUpdateBody)
                                });
                            }
                        } catch (formatErr) {
                            console.error('Failed to color deleted row red:', formatErr);
                        }
                    }

                    showNotification(auditAction === 'delete' ? 'Directive deleted successfully!' : `Directive audited: ${auditAction === 'verify' ? 'Verified' : auditAction === 'rework' ? 'Rework Required' : 'Reset'}`);
                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Audit failed: ' + err.message, 'error');
                } finally {
                    setEditingDirective(null);
                    setLoading(false);
                }
            };

            // Trigger edit dialog
            const openEditModal = (directive) => {
                setEditingDirective(directive);
                setEditDescription(directive.description || '');
                setEditStatus(directive.status);
                let verVal = directive.verification || 'Pending';
                if (verVal === 'Done') verVal = 'Verified';
                setEditVerification(verVal);
                setEditRemark(directive.remark);
                setEditDelegated(directive.delegatedTo);
                setEditReportName(directive.reportName || '');
                
                // Initialize timeline editing state
                if (directive.type === 'Reports') {
                    const rep = directive.repetition || '';
                    if (rep.toLowerCase() === 'on event') {
                        setEditReportTimeline('On Event');
                        setEditReportDay('1');
                    } else if (rep.toLowerCase() === 'daily') {
                        setEditReportTimeline('Daily');
                        setEditReportDay('');
                    } else if (rep.includes(' - ')) {
                        const parts = rep.split(' - ');
                        const timeline = parts[0].trim();
                        const day = parts[1].trim();
                        setEditReportTimeline(timeline);
                        setEditReportDay(day);
                    } else {
                        setEditReportTimeline('Weekly');
                        setEditReportDay('Monday');
                    }
                } else {
                    setEditReportTimeline('Weekly');
                    setEditReportDay('Monday');
                }
                
                setEditPriority(directive.priority || 'Normal');
                if (directive.type === 'Instruction') {
                    setEditInstructionType(directive.repetition || 'Temporary');
                }
                
                let targetDateHtml = '';
                if (directive.targetDate) {
                    const parsed = parseDateString(directive.targetDate);
                    if (parsed && !isNaN(parsed.getTime()) && parsed.getTime() > 0) {
                        const year = parsed.getFullYear();
                        const month = String(parsed.getMonth() + 1).padStart(2, '0');
                        const day = String(parsed.getDate()).padStart(2, '0');
                        targetDateHtml = `${year}-${month}-${day}`;
                    }
                }
                setEditTargetDate(targetDateHtml);

                let dateHtml = '';
                if (directive.date) {
                    const parsed = parseDateString(directive.date);
                    if (parsed && !isNaN(parsed.getTime()) && parsed.getTime() > 0) {
                        const year = parsed.getFullYear();
                        const month = String(parsed.getMonth() + 1).padStart(2, '0');
                        const day = String(parsed.getDate()).padStart(2, '0');
                        dateHtml = `${year}-${month}-${day}`;
                    }
                }
                setEditDate(dateHtml);
            };

            // Handle WSR Print Document Generation
            const handlePrintWsr = () => {
                if (!filteredDirectives || filteredDirectives.length === 0) {
                    showNotification('No WSR directives found to print.', 'warning');
                    return;
                }
                
                const printWindow = window.open('', '_blank', 'width=800,height=800');
                if (!printWindow) {
                    showNotification('Pop-up blocked. Please allow pop-ups to print WSR.', 'error');
                    return;
                }
                
                const deptNames = [...new Set(filteredDirectives.map(d => d.departmentName))].join(' & ');
                const headNames = [...new Set(filteredDirectives.map(d => d.headName))].join(' & ');
                const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                
                const tableRowsHtml = filteredDirectives.map((d, index) => {
                    return `
                        <tr>
                            <td style="padding: 10px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${index + 1}</td>
                            <td style="padding: 10px; border: 1px solid #cbd5e1; font-family: 'Noto Sans Devanagari', 'Inter', sans-serif; font-size: 13px; line-height: 1.6;">${d.description}</td>
                            <td style="padding: 10px; border: 1px solid #cbd5e1; text-align: center;"></td>
                        </tr>
                    `;
                }).join('');
                
                const docHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>WSR Affirmation Sheet - ${deptNames}</title>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
                        <style>
                            body {
                                font-family: 'Inter', sans-serif;
                                color: #1e293b;
                                padding: 40px;
                                max-width: 800px;
                                margin: 0 auto;
                            }
                            .header-table {
                                width: 100%;
                                border-collapse: collapse;
                                margin-bottom: 30px;
                            }
                            .header-table td {
                                padding: 6px;
                                font-size: 12px;
                            }
                            .title {
                                text-align: center;
                                font-size: 22px;
                                font-weight: 800;
                                text-transform: uppercase;
                                margin-bottom: 20px;
                                color: #0f172a;
                                border-bottom: 2px solid #0f172a;
                                padding-bottom: 10px;
                            }
                            table.wsr-table {
                                width: 100%;
                                border-collapse: collapse;
                                margin-top: 15px;
                                margin-bottom: 50px;
                            }
                            table.wsr-table th {
                                background-color: #f8fafc;
                                padding: 12px 10px;
                                border: 1px solid #cbd5e1;
                                font-size: 11px;
                                font-weight: 800;
                                text-transform: uppercase;
                                color: #475569;
                                text-align: center;
                            }
                            .signature-section {
                                display: flex;
                                justify-content: space-between;
                                margin-top: 60px;
                                font-size: 13px;
                            }
                            .signature-box {
                                text-align: center;
                                width: 220px;
                                border-top: 1px dashed #64748b;
                                padding-top: 10px;
                                font-weight: 600;
                                color: #334155;
                            }
                            .print-footer {
                                text-align: center;
                                font-size: 10px;
                                color: #94a3b8;
                                margin-top: 40px;
                                border-top: 1px solid #e2e8f0;
                                padding-top: 15px;
                            }
                            @media print {
                                body { padding: 20px; }
                                button { display: none; }
                            }
                        </style>
                    </head>
                    <body>
                        <div style="text-align: right; margin-bottom: 20px;">
                            <button onclick="window.print()" style="padding: 10px 20px; background-color: #0f172a; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit;">
                                Print Document
                            </button>
                        </div>
                        
                        <div class="title">WSR Affirmation & Status Sign-Off</div>
                        
                        <table class="header-table">
                            <tr>
                                <td style="font-weight: 800; width: 120px;">Department(s):</td>
                                <td>${deptNames}</td>
                                <td style="font-weight: 800; width: 80px; text-align: right;">Date:</td>
                                <td style="text-align: right; font-weight: 600;">${dateStr}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: 800;">Department Head:</td>
                                <td>${headNames}</td>
                                <td style="font-weight: 800; text-align: right;">System:</td>
                                <td style="text-align: right;">MD Command Center</td>
                            </tr>
                        </table>
                        
                        <table class="wsr-table">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">S.No.</th>
                                    <th>Affirmation Particulars / Directives</th>
                                    <th style="width: 150px;">Verification Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRowsHtml}
                            </tbody>
                        </table>
                        
                        <div class="signature-section">
                            <div class="signature-box">
                                Department Head Signature<br>
                                <span style="font-size: 10px; font-weight: normal; color: #94a3b8; margin-top: 4px; display: block;">(${headNames})</span>
                            </div>
                            <div class="signature-box">
                                MD / Admin Verification<br>
                                <span style="font-size: 10px; font-weight: normal; color: #94a3b8; margin-top: 4px; display: block;">(Sign & Seal)</span>
                            </div>
                        </div>
                        
                        <div class="print-footer">
                            Generated from MD Command Center on ${new Date().toLocaleString('en-GB')}
                        </div>
                    </body>
                    </html>
                `;
                
                printWindow.document.write(docHtml);
                printWindow.document.close();
                setTimeout(() => {
                    printWindow.focus();
                    printWindow.print();
                }, 500);
            };

            // Unique creators for filtering
            const uniqueCreators = React.useMemo(() => {
                const creators = new Set();
                directives.forEach(d => {
                    if (d.status !== 'Deleted') {
                        if (d.createdBy) {
                            creators.add(d.createdBy);
                        } else {
                            creators.add('System/SOP');
                        }
                    }
                });
                return Array.from(creators).sort();
            }, [directives]);

            // Filtering calculations (base filters excluding metrics tab)
            const baseFilteredDirectives = directives.filter(d => {
                if (d.status === 'Deleted') return false;
                
                // Hide MD verified/done standard/Reports directives by default unless toggled on
                const isVerified = d.type !== 'WSR' && (d.verification === 'Done' || d.verification === 'Verified');
                if (!showCompletedAudits && isVerified) return false;
                const matchesSearch = 
                    (d.description && d.description.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.remark && d.remark.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.delegatedTo && d.delegatedTo.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.headName && d.headName.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const matchesDept = filterDept === 'All' || d.departmentId === filterDept;
                const matchesStatus = filterStatus === 'All' || d.status === filterStatus;
                const matchesPriority = filterPriority === 'All' || d.priority === filterPriority;
                const matchesType = filterType === 'All' || d.type === filterType;
                const matchesCreator = filterCreator === 'All' || 
                    (filterCreator === 'System/SOP' ? !d.createdBy : d.createdBy === filterCreator);

                // Visibility filter for repeating WSR/Reports directives for non-MD roles
                const isMD = !!effectivePermissions.CanVerifyDirectives;
                let matchesRepeatingVisibility = true;
                if (!isMD && (d.type === 'WSR' || d.type === 'Reports')) {
                    matchesRepeatingVisibility = isDueToday(d.type, d.repetition) || d.status === 'Pending';
                }

                return matchesSearch && matchesDept && matchesStatus && matchesPriority && matchesType && matchesCreator && matchesRepeatingVisibility;
            });

            // Metrics calculation based on the base filtered list
            const metrics = React.useMemo(() => {
                const nonWsr = baseFilteredDirectives.filter(d => d.type !== 'WSR');
                // Pending tasks = Pending or Not Seen
                const pending = nonWsr.filter(d => ['Pending', 'Not Seen'].includes(d.status)).length;
                // Active status = Not Seen, Pending, In Progress, On Hold
                const active = nonWsr.filter(d => ['Not Seen', 'Pending', 'In Progress', 'On Hold'].includes(d.status)).length;
                // Overdue status
                const overdue = nonWsr.filter(d => isDirectiveOverdue(d)).length;
                // Awaiting Audit (Completed status but not verified yet)
                const awaitingAudit = nonWsr.filter(d => d.status === 'Completed' && d.verification !== 'Done' && d.verification !== 'Verified').length;
                // Completed Audits (MD verified Done)
                const verified = nonWsr.filter(d => d.verification === 'Done' || d.verification === 'Verified').length;

                return { pending, active, overdue, awaitingAudit, verified };
            }, [baseFilteredDirectives]);

            // Final filtered directives after applying active metric tab toggle, sorted descending by date
            const filteredDirectives = React.useMemo(() => {
                let list = baseFilteredDirectives;
                if (activeMetricTab === 'Pending') {
                    // Filter by specific status "Pending" or "Not Seen" when Pending Tasks card is active
                    list = list.filter(d => d.type !== 'WSR' && ['Pending', 'Not Seen'].includes(d.status));
                } else if (activeMetricTab === 'Active') {
                    list = list.filter(d => d.type !== 'WSR' && ['Not Seen', 'Pending', 'In Progress', 'On Hold'].includes(d.status));
                } else if (activeMetricTab === 'Overdue') {
                    list = list.filter(d => isDirectiveOverdue(d) || (d.type !== 'WSR' && d.status === 'Completed' && d.verification !== 'Done' && d.verification !== 'Verified'));
                } else if (activeMetricTab === 'AwaitingAudit') {
                    list = list.filter(d => d.type !== 'WSR' && d.status === 'Completed' && d.verification !== 'Done' && d.verification !== 'Verified');
                } else if (activeMetricTab === 'Completed') {
                    list = list.filter(d => d.type !== 'WSR' && (d.verification === 'Done' || d.verification === 'Verified'));
                }
                return [...list].sort((a, b) => {
                    const dateA = parseDateString(a.date);
                    const dateB = parseDateString(b.date);
                    if (dateB - dateA !== 0) {
                        return dateB - dateA;
                    }
                    // Secondary sort by type (WSR vs others)
                    if (a.type === 'WSR' && b.type !== 'WSR') return 1;
                    if (a.type !== 'WSR' && b.type === 'WSR') return -1;
                    // Preserve spreadsheet relative order in reverse (latest row first)
                    if (a.spreadsheetId !== b.spreadsheetId) {
                        return b.spreadsheetId.localeCompare(a.spreadsheetId);
                    }
                    return b.excelRowNumber - a.excelRowNumber;
                });
            }, [baseFilteredDirectives, activeMetricTab]);

            const allSynced = React.useMemo(() => {
                return mappings.length > 0 && mappings.every(map => syncStatuses[map.spreadsheetId]?.status === 'success');
            }, [mappings, syncStatuses]);

            const anyFailed = React.useMemo(() => {
                return mappings.some(map => syncStatuses[map.spreadsheetId]?.status === 'error');
            }, [mappings, syncStatuses]);

            const showDeptColumn = React.useMemo(() => {
                return activeRole && (effectivePermissions.CanVerifyDirectives || (activeRole.mappings && activeRole.mappings.length > 1));
            }, [activeRole, effectivePermissions]);

            const canShowCreatedBy = React.useMemo(() => {
                return activeRole && (effectivePermissions.CanVerifyDirectives || (activeRole.mappings && activeRole.mappings.length > 1));
            }, [activeRole, effectivePermissions]);

            const canModifyDirective = React.useCallback((d, action) => {
                if (!d) return false;
                const userEmail = auth?.email?.toLowerCase() || '';
                
                const mdEmailsList = mdEmail.split(',').map(e => e.trim().toLowerCase());
                if (mdEmailsList.includes(userEmail)) {
                    return true;
                }

                if (action === 'edit') {
                    const perm = effectivePermissions.CanEditDirectives;
                    if (perm === true || String(perm).toUpperCase() === 'ALL') return true;
                    if (String(perm).toUpperCase() === 'OWNED') {
                        return d.createdBy && d.createdBy.toLowerCase() === userEmail;
                    }
                    return false;
                }
                
                if (action === 'delete') {
                    const perm = effectivePermissions.CanDeleteDirectives;
                    if (perm === true || String(perm).toUpperCase() === 'ALL') return true;
                    if (String(perm).toUpperCase() === 'OWNED') {
                        return d.createdBy && d.createdBy.toLowerCase() === userEmail;
                    }
                    return false;
                }

                if (action === 'verify') {
                    const perm = effectivePermissions.CanVerifyDirectives;
                    return perm === true || String(perm).toUpperCase() === 'TRUE';
                }

                return false;
            }, [auth, mdEmail, effectivePermissions]);

            const showDetailEditButton = selectedDirective ? (canModifyDirective(selectedDirective, 'edit') || selectedDirective.type !== 'WSR') : false;
            const showDetailReminderButton = selectedDirective ? (effectivePermissions.CanVerifyDirectives && selectedDirective.status !== 'Completed' && selectedDirective.status !== 'Checked & Confirmed' && selectedDirective.status !== 'Deleted' && isPendingMoreThan24Hours(selectedDirective.date)) : false;

            // Check if we are in TV / Cabin Dashboard mode
            const isCabinDashboard = React.useMemo(() => {
                const path = window.location.pathname;
                const search = window.location.search;
                const hash = window.location.hash;
                return path.endsWith('/dashboard') || search.includes('view=dashboard') || hash === '#/dashboard';
            }, []);

            // Silent Auto-Refresh Loop for MD Cabin TV Screen
            React.useEffect(() => {

                const interval = setInterval(() => {
                    if (activeRole && !activeRole.isUnregistered && typeof loadSpreadsheetData === 'function') {
                        loadSpreadsheetData();
                    }
                }, 60000); // refresh every 60s
                
                return () => clearInterval(interval);
            }, [isCabinDashboard, activeRole]);

            // Helper to get previous week code
            const getLastWeekCode = (currentWeek = getCurrentWeekCode()) => {
                const match = currentWeek.match(/(\d{4})-W(\d{2})/);
                if (!match) return '';
                const year = parseInt(match[1], 10);
                const week = parseInt(match[2], 10);
                if (week === 1) {
                    return `${year - 1}-W52`;
                }
                const pad = (val) => String(val).padStart(2, '0');
                return `${year}-W${pad(week - 1)}`;
            };

            // Calculate unanswered coordinators count for current week
            const unansweredThisWeekCount = React.useMemo(() => {
                if (!mappings || !sops || !sopMappings || !sopReadRecords) return 0;
                return mappings.filter(map => {
                    const email = map.headEmail.toLowerCase();
                    const mappedSopIds = sopMappings
                        .filter(m => String(m.type).trim().toLowerCase() === 'dept' && String(m.targetId).trim().toLowerCase() === String(map.id).trim().toLowerCase())
                        .map(m => String(m.sopId).trim().toLowerCase());
                    const resolvedSopIds = new Set(mappedSopIds);
                    if (Array.isArray(map.sops)) {
                        map.sops.forEach(s => resolvedSopIds.add(String(s.id).trim().toLowerCase()));
                    }
                    
                    // Resolve group-level mappings dynamically
                    const groupIds = deptGroups
                        .filter(g => String(g.deptId).trim().toLowerCase() === String(map.id).trim().toLowerCase())
                        .map(g => String(g.groupId).trim().toLowerCase());
                    
                    const groupSopIds = sopMappings
                        .filter(m => {
                            const mType = String(m.type).trim().toLowerCase();
                            const mTarget = String(m.targetId).trim().toLowerCase();
                            return mType === 'group' && (groupIds.includes(mTarget) || mTarget === 'default');
                        })
                        .map(m => String(m.sopId).trim().toLowerCase());
                        
                    groupSopIds.forEach(id => resolvedSopIds.add(id));
                    
                    const activePolicies = sops.filter(p => resolvedSopIds.has(String(p.sopId).trim().toLowerCase()) && String(p.status).trim().toLowerCase() !== 'inactive');
                    if (activePolicies.length === 0) return false;
                    
                    const pendingPolicies = activePolicies.filter(policy => {
                        return !sopReadRecords.some(r => 
                            String(r.userEmail).trim().toLowerCase() === String(email).trim().toLowerCase() &&
                            String(r.weekCode).trim().toLowerCase() === String(getCurrentWeekCode()).trim().toLowerCase() &&
                            String(r.sopId).trim().toLowerCase() === String(policy.sopId).trim().toLowerCase() &&
                            String(r.policyId).trim().toLowerCase() === String(policy.policyId).trim().toLowerCase()
                        );
                    });
                    return pendingPolicies.length > 0;

                const overdue = nonWsr.filter(d => isDirectiveOverdue(d)).length;
                const awaitingAudit = nonWsr.filter(d => d.status === 'Completed' && d.verification !== 'Done' && d.verification !== 'Verified').length;

                    active,

                                    {dispatchType !== 'WSR' && dispatchType !== 'Reports' && (
                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Target Completion Date</label>
                                            <input
                                                type="date"
                                                value={dispatchTargetDate}
                                                onChange={(e) => setDispatchTargetDate(e.target.value)}
                                                className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20"
                                            />
                                        </div>
                                    )}

                                    <div className="flex items-center gap-3 mt-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsDispatchOpen(false)}
                                            className="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 font-semibold rounded-xl border border-slate-200 transition-all cursor-pointer text-sm"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={dispatchLoading}
                                            className={`w-1/2 py-3 rounded-xl font-bold text-sm tracking-wide transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer shadow-lg ${
                                                dispatchSuccess 
                                                ? 'bg-emerald-500 text-white shadow-emerald-500/10' 
                                                : 'bg-teal-500 hover:bg-teal-400 text-slate-950 hover:shadow-teal-500/10'
                                            }`}
                                        >
                                            {dispatchLoading ? (
                                                <span className="h-4 w-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                                            ) : dispatchSuccess ? (
                                                <>
                                                    <Icon name="check" className="w-4 h-4 text-white" /> Submitted
                                                </>
                                            ) : (
                                                <>
                                                    <Icon name="plus" className="w-4 h-4" /> Final Submit
                                                </>
                                            )}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Individual Reminder Confirmation Popup Modal */}
                    {reminderTarget && (
                        <div 
                            className="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-slate-950/40 backdrop-blur-sm animate-fade-in"
                            onClick={() => setReminderTarget(null)}
                        >
                            <div 
                                className="w-full max-w-lg bg-white border border-slate-200 rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col gap-4 md:gap-5 relative text-slate-800 animate-slide-up max-h-[92vh] overflow-y-auto"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <button
                                    onClick={() => setReminderTarget(null)}
                                    className="absolute top-5 right-5 p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700 transition-all cursor-pointer"
                                >
                                    <Icon name="close" className="w-5 h-5" />
                                </button>

                                <div>
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <span className="p-1.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-600">
                                            <Icon name="mail" className="w-4 h-4 text-amber-650" strokeWidth={2.5} />
                                        </span>
                                        Confirm Send Reminder
                                    </h3>
                                    <p className="text-xs text-slate-450 font-medium mt-1">
                                        Send an email reminder regarding outstanding Row {reminderTarget.excelRowNumber}
                                    </p>
                                </div>

                                <div className="bg-slate-50 border border-slate-150 rounded-2xl p-4 flex flex-col gap-3 text-xs md:text-sm">
                                    <div className="flex justify-between border-b border-slate-200 pb-2">
                                        <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Recipient</span>
                                        <span className="text-slate-800 font-bold">{reminderTarget.headName || 'Coordinator'}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-200 pb-2">
                                        <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Email Address</span>
                                        <span className="text-slate-700 font-mono font-bold">{reminderTarget.headEmail}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-200 pb-2">
                                        <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Department</span>
                                        <span className="text-slate-800 font-bold">{reminderTarget.departmentName}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-200 pb-2">
                                        <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Issued Date</span>
                                        <span className="text-slate-705 font-mono font-bold">{reminderTarget.date}</span>
                                    </div>
                                    {reminderTarget.targetDate && (
                                        <div className="flex justify-between border-b border-slate-200 pb-2">
                                            <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Target Date</span>
                                            <span className="text-slate-705 font-mono font-bold">{reminderTarget.targetDate}</span>
                                        </div>
                                    )}
                                    <div className="flex flex-col gap-1 mt-1">
                                        <span className="text-slate-450 font-bold uppercase tracking-wider text-[10px]">Directive Details</span>
                                        <p className="text-slate-800 hindi-text leading-relaxed bg-white border border-slate-150 rounded-xl p-2.5 max-h-36 overflow-y-auto whitespace-pre-wrap select-all">
                                            {reminderTarget.description}
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-3 mt-2">
                                    <button
                                        type="button"
                                        onClick={() => setReminderTarget(null)}
                                        className="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 font-semibold rounded-xl border border-slate-200 transition-all cursor-pointer text-sm"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={sendIndividualReminderSubmit}
                                        disabled={reminderLoading}
                                        className="w-1/2 py-3 bg-amber-500 hover:bg-amber-450 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/10 flex items-center justify-center gap-2 cursor-pointer text-sm disabled:opacity-50"
                                    >
                                        {reminderLoading ? (
                                            <span className="h-4 w-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                                        ) : (
                                            <>
                                                <Icon name="mail" className="w-4 h-4 text-slate-950" strokeWidth={2.5} />
                                                <span>Send Email</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Dynamic Footer */}
                    <footer className="bg-slate-100 border-t border-slate-200 text-slate-400 py-6 px-6 text-center text-xs font-semibold mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <p>&copy; 2026 MD Command Center. Client-Side Zero-Trust Sheets Engine.</p>
                            <p className="flex items-center gap-1.5">
                                <span className="h-2 w-2 rounded-full bg-indigo-500 animate-pulse"></span> 
                                Powered by Google Cloud GIS & Sheets API REST v4
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render React DOM Hook
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
    
    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch((error) => {
                        console.error('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>

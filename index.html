        // Date helper functions
        function parseExcelDate(val) {
            if (!val) return '';
            if (!isNaN(val) && String(val).trim() !== '') {
                const num = Number(val);
                // Excel 1900 leap year bug handler
                const date = new Date(Math.round((num - (num > 60 ? 25569 : 25568)) * 86400 * 1000));
                return formatDateString(date);
            }
            return String(val);
        }

        // Format Date to DD-MMM-YYYY
        function formatDateString(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(date.getDate()).padStart(2, '0');
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function formatDateTimeString(date) {
            const dateStr = formatDateString(date);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${dateStr} ${hours}:${minutes}`;
        }

                            email: userInfo.email.toLowerCase(),
                            name: userInfo.name || userInfo.email,
                            picture: userInfo.picture || ''
                        });
                        setIsSandbox(false);
                        showNotification(`Logged in as ${userInfo.name || userInfo.email}`, 'success');
                    } else {
                        throw new Error('Could not retrieve email address.');
                    }
                } catch (err) {
                    showNotification('Sign-in failed: ' + err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const triggerGoogleLogin = () => {
                if (!tokenClient) {
                    showNotification('Google OAuth Client ID is missing or incorrect. Click settings (cog) to check.', 'error');
                    return;
                }
                tokenClient.requestAccessToken({ prompt: 'consent' });
            };

            const handleLogout = () => {
                setAuth(null);
                setIsSandbox(false);
                setDirectives([]);
                showNotification('Logged out successfully.', 'info');
            };

            // Identify current role and view mode
            const getActiveUserRole = () => {
                if (isSandbox) {
                    if (sandboxRole === 'MD') return { isMD: true, email: mdEmail.toLowerCase(), name: 'Managing Director (Demo)' };
                    const mapping = mappings.find(m => `DH:${m.headEmail.toLowerCase()}` === sandboxRole);
                    return {
                        isMD: false,
                        email: mapping?.headEmail.toLowerCase() || '',
                        name: mapping?.headName || 'Department Head (Demo)',
                        mapping: mapping
                    };
                }
                if (!auth) return null;
                const userEmail = auth.email.toLowerCase();
                if (userEmail === mdEmail.toLowerCase()) {
                    return { isMD: true, email: userEmail, name: auth.name };
                }
                const mapping = mappings.find(m => m.headEmail.toLowerCase() === userEmail);
                if (mapping) {
                    return {
                        isMD: false,
                        email: userEmail,
                        name: auth.name,
                        mapping: mapping
                    };
                }
                return { isUnregistered: true, email: userEmail, name: auth.name };
            };

            const activeRole = getActiveUserRole();

            // Get all sheets that failed to sync
            const getSyncErrors = () => {
                if (isSandbox) return [];
                if (!activeRole) return [];
                const sheetsToCheck = activeRole.isMD ? mappings : [activeRole.mapping].filter(Boolean);
                const errors = [];
                sheetsToCheck.forEach(map => {
                    const status = syncStatuses[map.spreadsheetId];
                    if (status && status.status === 'error') {
                        errors.push({
                            map,
                            error: status.error
                        });
                    }
                });
                return errors;
            };
            const syncErrors = getSyncErrors();

            // Fetch Sheets data
            const loadSpreadsheetData = React.useCallback(async () => {
                if (!activeRole) return;
                setLoading(true);
                const statuses = {};
                let compiledDirectives = [];

                if (isSandbox) {
                    // Sandbox loading
                    if (activeRole.isMD) {
                        // Aggregate all sheets
                        mappings.forEach(map => {
                            const sheetRows = mockDb[map.spreadsheetId] || [];
                            const parsed = parseSheetRows(sheetRows, map);
                            compiledDirectives = [...compiledDirectives, ...parsed];
                            statuses[map.spreadsheetId] = { status: 'success' };
                        });
                    } else if (activeRole.mapping) {
                        const map = activeRole.mapping;
                        const sheetRows = mockDb[map.spreadsheetId] || [];
                        compiledDirectives = parseSheetRows(sheetRows, map);
                        statuses[map.spreadsheetId] = { status: 'success' };
                    }
                    setDirectives(compiledDirectives);
                    setSyncStatuses(statuses);
                    setLoading(false);
                    return;
                }

                // Production loading via Google Sheets API
                if (!auth) return;
                
                try {
                    const sheetsToFetch = activeRole.isMD ? mappings : [activeRole.mapping].filter(Boolean);
                    
                    const fetchPromises = sheetsToFetch.map(async (map) => {
                        try {
                            const response = await fetch(
                                `https://sheets.googleapis.com/v4/spreadsheets/${map.spreadsheetId}/values/${encodeURIComponent(sheetTabName)}!A1:J1000?valueRenderOption=FORMATTED_VALUE&_t=${Date.now()}`,
                                {
                                    headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                                }
                            );
                            
                            if (!response.ok) {
                                if (response.status === 403) {
                                    throw new Error('403 Forbidden (No permission to this sheet)');
                                } else if (response.status === 404) {
                                    throw new Error('404 Not Found (Invalid Spreadsheet ID)');
                                } else {
                                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                                }
                            }
                            
                            const data = await response.json();
                            statuses[map.spreadsheetId] = { status: 'success' };
                            return parseSheetRows(data.values || [], map);
                        } catch (err) {
                            console.error(`Error loading sheet for ${map.deptName}:`, err);
                            statuses[map.spreadsheetId] = { status: 'error', error: err.message };
                            return [];
                        }
                    });

                    const results = await Promise.all(fetchPromises);
                    results.forEach(rows => {
                        compiledDirectives = [...compiledDirectives, ...rows];
                    });
                    
                    setDirectives(compiledDirectives);
                    setSyncStatuses(statuses);
                } catch (err) {
                    showNotification('Error syncing Google Sheets: ' + err.message, 'error');
                } finally {
                    setLoading(false);
                }
            }, [isSandbox, auth, activeRole, mappings, mockDb, sheetTabName]);

            // Load data when active role changes
            React.useEffect(() => {
                if (activeRole && !activeRole.isUnregistered) {
                    loadSpreadsheetData();
                }
            }, [sandboxRole, isSandbox, auth, mappings]);

            // Save sandbox DB changes to local storage
            React.useEffect(() => {
                if (isSandbox) {
                    localStorage.setItem('pcil_mockDb', JSON.stringify(mockDb));
                }
            }, [mockDb, isSandbox]);

            // Parse sheet rows, identifying headers dynamically
            const parseSheetRows = (values, mapping) => {
                if (!values || values.length === 0) return [];
                
                // Scan rows to find headers containing Date and Description
                let headerIndex = -1;
                for (let i = 0; i < Math.min(10, values.length); i++) {
                    const row = values[i];
                    if (row && row.some(cell => typeof cell === 'string' && cell.toLowerCase().includes('date')) &&
                              row.some(cell => typeof cell === 'string' && cell.toLowerCase().includes('description'))) {
                        headerIndex = i;
                        break;
                    }
                }

                // If headers not found, assume index 0 is headers or assume starting row
                const dataStartRow = headerIndex !== -1 ? headerIndex + 1 : 1;
                
                const parsedDirectives = [];
                for (let i = dataStartRow; i < values.length; i++) {
                    const row = values[i];
                    const isRowEmpty = !row || row.length === 0 || row.every(cell => cell === undefined || String(cell).trim() === "");
                    if (isRowEmpty) continue;

                    parsedDirectives.push({
                        excelRowNumber: i + 1, // 1-indexed row number in the actual Google Sheet
                        spreadsheetId: mapping.spreadsheetId,
                        departmentId: mapping.id,
                        departmentName: mapping.deptName,
                        headName: mapping.headName,
                        headEmail: mapping.headEmail,
                        
                        date: parseExcelDate(row[0]) || '',
                        type: row[1] || 'Work',
                        description: row[2] || '',
                        priority: row[3] || 'Normal',
                        targetDate: parseExcelDate(row[4]) || '',
                        verification: row[5] || 'Pending',
                        status: row[6] || 'Pending',
                        remark: row[7] || '',
                        delegatedTo: row[8] || '',
                        completionDate: row[9] || ''
                    });
                }
                return parsedDirectives;
            };

            // Write a new directive (MD dispatch)
            const handleDispatchSubmit = async (e) => {
                e.preventDefault();
                if (!dispatchDeptId) {
                    showNotification('Please select a recipient department.', 'error');
                    return;
                }
                
                const targetDept = mappings.find(m => m.id === dispatchDeptId);
                if (!targetDept) return;

                setDispatchLoading(true);
                const todayStr = formatDateString(new Date());
                const targetDateStr = dispatchTargetDate ? formatDateString(new Date(dispatchTargetDate)) : '';
                
                // Sequence matches exactly: Date, Type, Description, Priority, Target Date, Verification, Status, Remark, Delegated To, Completion Date
                const rowValues = [
                    todayStr,
                    dispatchType,
                    dispatchDesc,
                    dispatchPriority,
                    targetDateStr,
                    'Pending',     // Verification
                    'Not Seen',    // Status
                    '',            // Remark
                    '',            // Delegated To
                    ''             // Completion Date
                ];

                if (isSandbox) {
                    // Sandbox writing
                    const existingRows = mockDb[targetDept.spreadsheetId] || [
                        ["Date", "Type", "Description", "Priority", "Target Date", "Verification", "Status", "Remark", "Delegated To", "Completion Date"]
                    ];
                    
                    const updatedRows = [...existingRows, rowValues];
                    setMockDb(prev => ({
                        ...prev,
                        [targetDept.spreadsheetId]: updatedRows
                    }));
                    
                    setDispatchDesc('');
                    setDispatchTargetDate('');
                    showNotification(`Directive successfully dispatched to ${targetDept.headName} (Sandbox Mode)`, 'success');
                    setDispatchSuccess(true);
                    setTimeout(() => setDispatchSuccess(false), 3000);
                    setDispatchLoading(false);
                    // Reload data
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                // Google Sheets API append request
                if (!auth) return;
                try {
                    const response = await fetch(
                        `https://sheets.googleapis.com/v4/spreadsheets/${targetDept.spreadsheetId}/values/${encodeURIComponent(sheetTabName)}!A:J:append?valueInputOption=USER_ENTERED`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [rowValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        const errDetails = await response.text();
                        throw new Error(`Failed to append row: ${response.statusText}. details: ${errDetails}`);
                    }

                    setDispatchDesc('');
                    setDispatchTargetDate('');
                    showNotification(`Directive successfully dispatched to ${targetDept.headName}!`, 'success');
                    setDispatchSuccess(true);
                    setTimeout(() => setDispatchSuccess(false), 3000);
                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Dispatch failed: ' + err.message, 'error');
                } finally {
                    setDispatchLoading(false);
                }
            };

            // Save row updates (Status, Remark, Delegated To, Verification etc.)
            const handleUpdateRow = async (updatedFields) => {
                if (!editingDirective) return;
                setEditLoading(true);

                const currentDirective = editingDirective;
                const excelRowNumber = currentDirective.excelRowNumber;
                
                // Assemble the full updated row
                const dateVal = currentDirective.date;
                const typeVal = currentDirective.type;
                const descVal = currentDirective.description;
                const priorityVal = currentDirective.priority;
                const targetDateVal = currentDirective.targetDate;

                const newVerification = updatedFields.hasOwnProperty('verification') ? updatedFields.verification : currentDirective.verification;
                const newStatus = updatedFields.hasOwnProperty('status') ? updatedFields.status : currentDirective.status;
                const newRemark = updatedFields.hasOwnProperty('remark') ? updatedFields.remark : currentDirective.remark;
                const newDelegated = updatedFields.hasOwnProperty('delegatedTo') ? updatedFields.delegatedTo : currentDirective.delegatedTo;
                
                // Complete date handler
                let newCompletionDate = currentDirective.completionDate;
                if (updatedFields.status === 'Completed' && currentDirective.status !== 'Completed') {
                    newCompletionDate = formatDateTimeString(new Date());
                } else if (updatedFields.status && updatedFields.status !== 'Completed') {
                    newCompletionDate = '';
                }

                // If MD verification marks completed
                if (updatedFields.verification === 'Done' && newStatus !== 'Checked & Confirmed') {
                    // Automatically upgrade to Checked & Confirmed
                    // And check if Completion Date was missing
                    if (!newCompletionDate) {
                        newCompletionDate = formatDateTimeString(new Date());
                    }
                }

                const updatedRowValues = [
                    dateVal,
                    typeVal,
                    descVal,
                    priorityVal,
                    targetDateVal,
                    newVerification,
                    newStatus,
                    newRemark,
                    newDelegated,
                    newCompletionDate
                ];

                if (isSandbox) {
                    // Sandbox update
                    const sheetId = currentDirective.spreadsheetId;
                    const sheetRows = [...(mockDb[sheetId] || [])];
                    sheetRows[excelRowNumber - 1] = updatedRowValues;
                    
                    setMockDb(prev => ({
                        ...prev,
                        [sheetId]: sheetRows
                    }));

                    setEditingDirective(null);
                    showNotification('Directive updated successfully (Sandbox Mode)', 'success');
                    setEditLoading(false);
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                // Google Sheets API update row request
                if (!auth) return;
                try {
                    const response = await fetch(
                        `https://sheets.googleapis.com/v4/spreadsheets/${currentDirective.spreadsheetId}/values/${encodeURIComponent(sheetTabName)}!A${excelRowNumber}:J${excelRowNumber}?valueInputOption=USER_ENTERED`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [updatedRowValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Failed to update row: ${response.statusText}`);
                    }

                    setEditingDirective(null);
                    showNotification('Directive updated successfully!', 'success');
                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Update failed: ' + err.message, 'error');
                } finally {
                    setEditLoading(false);
                }
            };

            // Shortcut MD Actions: Verify and Reset
            const handleQuickAudit = async (directive, auditAction) => {
                let updatedFields = {};
                if (auditAction === 'verify') {
                    updatedFields = {
                        verification: 'Done',
                        status: 'Checked & Confirmed'
                    };
                } else if (auditAction === 'reset') {
                    updatedFields = {
                        verification: 'Pending',
                        status: 'In Progress'
                    };
                }

                setLoading(true);
                // Create temporary edit context to reuse update logic
                setEditingDirective(directive);
                
                const excelRowNumber = directive.excelRowNumber;
                
                // Assemble the full updated row
                const dateVal = directive.date;
                const typeVal = directive.type;
                const descVal = directive.description;
                const priorityVal = directive.priority;
                const targetDateVal = directive.targetDate;
                
                const newVerification = updatedFields.verification;
                const newStatus = updatedFields.status;
                const newRemark = directive.remark;
                const newDelegated = directive.delegatedTo;
                const newCompletionDate = auditAction === 'verify' ? (directive.completionDate || formatDateTimeString(new Date())) : '';

                const updatedRowValues = [
                    dateVal,
                    typeVal,
                    descVal,
                    priorityVal,
                    targetDateVal,
                    newVerification,
                    newStatus,
                    newRemark,
                    newDelegated,
                    newCompletionDate
                ];

                if (isSandbox) {
                    const sheetId = directive.spreadsheetId;
                    const sheetRows = [...(mockDb[sheetId] || [])];
                    sheetRows[excelRowNumber - 1] = updatedRowValues;
                    
                    setMockDb(prev => ({
                        ...prev,
                        [sheetId]: sheetRows
                    }));

                    setEditingDirective(null);
                    showNotification(`Directive audited: ${auditAction === 'verify' ? 'Verified' : 'Reset'} (Sandbox)`, 'success');
                    setTimeout(loadSpreadsheetData, 100);
                    return;
                }

                if (!auth) return;
                try {
                    const response = await fetch(
                        `https://sheets.googleapis.com/v4/spreadsheets/${directive.spreadsheetId}/values/${encodeURIComponent(sheetTabName)}!A${excelRowNumber}:J${excelRowNumber}?valueInputOption=USER_ENTERED`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                values: [updatedRowValues]
                            })
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Failed to update row: ${response.statusText}`);
                    }

                    showNotification(`Directive audited: ${auditAction === 'verify' ? 'Verified' : 'Reset'}`);
                    loadSpreadsheetData();
                } catch (err) {
                    showNotification('Audit failed: ' + err.message, 'error');
                } finally {
                    setEditingDirective(null);
                    setLoading(false);
                }
            };

            // Trigger edit dialog
            const openEditModal = (directive) => {
                setEditingDirective(directive);
                setEditStatus(directive.status);
                setEditRemark(directive.remark);
                setEditDelegated(directive.delegatedTo);
            };

            // Filtering calculations
            const filteredDirectives = directives.filter(d => {
                const matchesSearch = 
                    (d.description && d.description.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.remark && d.remark.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.delegatedTo && d.delegatedTo.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (d.headName && d.headName.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const matchesDept = filterDept === 'All' || d.departmentId === filterDept;
                const matchesStatus = filterStatus === 'All' || d.status === filterStatus;
                const matchesPriority = filterPriority === 'All' || d.priority === filterPriority;
                const matchesType = filterType === 'All' || d.type === filterType;

                return matchesSearch && matchesDept && matchesStatus && matchesPriority && matchesType;
            });

            // Metrics calculation
            const metrics = React.useMemo(() => {
                const total = directives.length;
                // Active status = Not Seen, Pending, In Progress, On Hold
                const active = directives.filter(d => ['Not Seen', 'Pending', 'In Progress', 'On Hold'].includes(d.status)).length;
                // Critical/Urgent status
                const urgent = directives.filter(d => (d.priority === 'Urgent' || d.priority === 'Very Urgent') && d.status !== 'Checked & Confirmed' && d.status !== 'Completed').length;
                // Completed Audits (MD verified Done)
                const verified = directives.filter(d => d.verification === 'Done').length;

                return { total, active, urgent, verified };
            }, [directives]);

            return (
                <div className="flex-grow flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-slate-900 border-b border-slate-800 text-white shadow-lg py-4 px-6 transition-all duration-300">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            {/* Brand Logo & Name */}
                            <div className="flex items-center gap-3">
                                <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-teal-400 to-indigo-500 flex items-center justify-center shadow-md shadow-indigo-500/10">
                                    <Icon name="sheet" className="w-5 h-5 text-slate-900" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-teal-200 via-indigo-205 to-white">
                                        PCIL Command Canvas
                                    </h1>
                                    <p className="text-xs text-slate-400 font-medium">Google Sheets Engine</p>
                                </div>
                            </div>

                            {/* Active Persona Banner for Sandbox */}
                            {isSandbox && (
                                <div className="bg-amber-500/10 border border-amber-500/30 text-amber-300 px-4 py-1.5 rounded-full flex items-center gap-2 text-xs font-semibold shadow-inner">
                                    <span className="h-2 w-2 rounded-full bg-amber-505 animate-pulse"></span>
                                    Demo Sandbox Active
                                    <span className="text-slate-500 font-normal">|</span>
                                    <span className="text-slate-100 flex items-center gap-1">
                                        Role: 
                                        <select 
                                            value={sandboxRole}
                                            onChange={(e) => setSandboxRole(e.target.value)}
                                            className="bg-slate-800 text-amber-350 border-none outline-none font-bold cursor-pointer rounded px-1.5 py-0.5"
                                        >
                                            <option value="MD">Managing Director</option>
                                            {mappings.map(m => (
                                                <option key={m.id} value={`DH:${m.headEmail.toLowerCase()}`}>
                                                    DH: {m.headName} ({m.deptName})
                                                </option>
                                            ))}
                                        </select>
                                    </span>
                                </div>
                            )}

                            {/* User Authentication Profile & Controls */}
                            <div className="flex items-center gap-4">
                                {activeRole ? (
                                    <div className="flex items-center gap-3">
                                        <div className="text-right hidden sm:block">
                                            <div className="text-sm font-semibold text-slate-100">{activeRole.name}</div>
                                            <div className="text-xs text-slate-405 flex items-center justify-end gap-1 font-medium">
                                                {activeRole.isMD ? (
                                                    <span className="text-teal-400 font-bold flex items-center gap-0.5">
                                                        <Icon name="shield" className="w-3.5 h-3.5" /> Managing Director
                                                    </span>
                                                ) : (
                                                    <span className="text-indigo-400 font-semibold">
                                                        Dept Head: {activeRole.mapping?.deptName}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        {isSandbox ? (
                                            <div className="h-9 w-9 rounded-full bg-indigo-650 flex items-center justify-center font-bold text-white shadow border border-indigo-400/20">
                                                {activeRole.name.charAt(0)}
                                            </div>
                                        ) : (
                                            auth?.picture ? (
                                                <img src={auth.picture} alt="Avatar" className="h-9 w-9 rounded-full border border-slate-700 shadow" />
                                            ) : (
                                                <div className="h-9 w-9 rounded-full bg-slate-800 flex items-center justify-center font-bold text-teal-450 shadow border border-slate-700">
                                                    {activeRole.name.charAt(0)}
                                                </div>
                                            )
                                        )}
                                        <button 
                                            onClick={handleLogout} 
                                            title="Logout"
                                            className="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-400 hover:text-rose-400 hover:bg-slate-800/80 hover:border-rose-900/30 transition-all cursor-pointer shadow-sm"
                                        >
                                            <Icon name="logout" className="w-4 h-4" />
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => {
                                                setIsSandbox(true);
                                                setSandboxRole('MD');
                                                showNotification('Entered Demo Sandbox Mode. No real Google updates will occur.', 'info');
                                            }}
                                            className="px-4 py-2 text-xs font-semibold text-teal-400 bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 rounded-xl transition-all cursor-pointer shadow-sm"
                                        >
                                            Demo Sandbox
                                        </button>
                                        
                                        {clientId ? (
                                            <button 
                                                onClick={triggerGoogleLogin}
                                                className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 border border-indigo-500/50 rounded-xl transition-all flex items-center gap-1.5 cursor-pointer shadow-md shadow-indigo-500/15"
                                            >
                                                <Icon name="globe" className="w-3.5 h-3.5" /> Sign In with Google
                                            </button>
                                        ) : (
                                            <span className="text-xs text-slate-500 font-medium px-2 italic">Credentials Pending</span>
                                        )}
                                    </div>
                                )}

                                {/* Admin Settings Button */}
                                <button 
                                    onClick={() => setIsSettingsOpen(true)}
                                    title="Administrative Settings"
                                    className="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-teal-400 hover:border-teal-900/30 transition-all cursor-pointer shadow-sm"
                                >
                                    <Icon name="settings" className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Notification Alert Bar */}
                    {notification && (
                        <div className="fixed top-20 right-6 z-50 animate-bounce">
                            <div className={`flex items-center gap-3 px-5 py-3.5 rounded-2xl border shadow-2xl backdrop-blur-md ${
                                notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                                notification.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                                'bg-slate-50 border-slate-200 text-slate-800'
                            }`}>
                                <Icon name={notification.type === 'error' ? 'alert' : 'check'} className="w-5 h-5 flex-shrink-0" />
                                <span className="text-sm font-semibold">{notification.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Main Workspace Area */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
                        {!activeRole ? (
                            /* Guest Landing Portal */
                            <div className="flex-grow flex items-center justify-center py-12">
                                <div className="max-w-md w-full glass-panel border border-slate-200 rounded-3xl p-8 shadow-xl text-center flex flex-col items-center gap-6 relative overflow-hidden bg-white/80">
                                    {/* Glowing accent circle */}
                                    <div className="absolute -top-16 -left-16 w-36 h-36 rounded-full bg-teal-500/5 blur-3xl"></div>

                                    <div className="h-16 w-16 rounded-2xl bg-gradient-to-tr from-teal-450 to-indigo-650 flex items-center justify-center shadow-xl shadow-indigo-500/10 mb-2">

            const [localClientId, setLocalClientId] = React.useState(clientId);
            const [localMdEmail, setLocalMdEmail] = React.useState(mdEmail);
            const [localSheetTabName, setLocalSheetTabName] = React.useState(sheetTabName);
            const [localMappings, setLocalMappings] = React.useState(mappings);
            const [activeTab, setActiveTab] = React.useState('general'); // 'general' | 'mappings' | 'json'

            const handleMappingChange = (index, field, value) => {
                const updated = [...localMappings];
                updated[index][field] = value;
                setLocalMappings(updated);
            };

            const addMappingRow = () => {
                setLocalMappings([
                    ...localMappings,
                    {
                        id: String(Date.now()),
                        deptName: '',
                        headName: '',
                        headEmail: '',
                        spreadsheetId: ''
                    }
                ]);
            };

            const removeMappingRow = (index) => {
                const updated = localMappings.filter((_, i) => i !== index);
                setLocalMappings(updated);
            };

            // JSON bulk editor
            const [jsonString, setJsonString] = React.useState(() => JSON.stringify(mappings, null, 2));
            const handleJsonSave = () => {
                try {
                    const parsed = JSON.parse(jsonString);
                    if (!Array.isArray(parsed)) {
                        alert('JSON config must be an array of department mapping objects.');
                        return;
                    }
                    const isValid = parsed.every(item => 
                        item.hasOwnProperty('deptName') && 
                        item.hasOwnProperty('headName') && 
                        item.hasOwnProperty('headEmail') && 
                        item.hasOwnProperty('spreadsheetId')
                    );
                    if (!isValid) {
                        alert('Each object must contain keys: deptName, headName, headEmail, spreadsheetId');
                        return;
                    }
                    const sanitized = parsed.map((item, idx) => ({
                        ...item,
                        deptName: (item.deptName || '').trim(),
                        headName: (item.headName || '').trim(),
                        headEmail: (item.headEmail || '').trim().toLowerCase(),
                        spreadsheetId: (item.spreadsheetId || '').trim(),
                        id: item.id || String(idx + 1)
                    }));
                    setLocalMappings(sanitized);
                    alert('JSON mappings parsed and loaded into table below!');
                } catch (e) {
                    alert('Invalid JSON structure: ' + e.message);
                }
            };

            const handleSave = () => {
                const trimmedClientId = (localClientId || '').trim();
                if (trimmedClientId && !trimmedClientId.endsWith('.apps.googleusercontent.com')) {
                    alert('Warning: Google OAuth Client ID usually ends with ".apps.googleusercontent.com". Please check for typos or extra trailing characters.');
                    return;
                }
                
                // Trim local mappings
                const trimmedMappings = localMappings.map(m => ({
                    ...m,
                    deptName: (m.deptName || '').trim(),
                    headName: (m.headName || '').trim(),
                    headEmail: (m.headEmail || '').trim().toLowerCase(),
                    spreadsheetId: (m.spreadsheetId || '').trim()
                }));
                
                onSave(trimmedClientId, localMdEmail, localSheetTabName, trimmedMappings);
                onClose();
            };

                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/45 backdrop-blur-sm animate-fade-in">

                                    <div className="flex flex-col gap-1.5">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                                            <Icon name="sheet" className="w-3.5 h-3.5 text-teal-505" /> Sheets Tab/Worksheet Name
                                        </label>
                                        <input
                                            type="text"
                                            value={localSheetTabName}
                                            onChange={(e) => setLocalSheetTabName(e.target.value)}
                                            placeholder="e.g. MD Directives"
                                            className="bg-slate-50 border border-slate-205 rounded-xl px-4 py-2.5 text-slate-800 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/20"
                                        />
                                        <p className="text-[10px] text-slate-450 font-medium">The specific worksheet name in each Spreadsheet. Must match exactly.</p>
                                    </div>

                                    {/* Sandbox Controls */}
                                    <div className="md:col-span-2 border-t border-slate-100 pt-5 mt-2 flex flex-col gap-3">
                                        <h4 className="text-sm font-bold text-slate-700">Demo Sandbox Maintenance</h4>
                                        <div className="flex items-center gap-4">
                                            <button
                                                onClick={onResetMockDb}
                                                className="px-4 py-2.5 text-xs font-bold text-rose-600 hover:text-white bg-rose-50 hover:bg-rose-600 border border-rose-200 hover:border-rose-600 rounded-xl transition-all cursor-pointer shadow-sm"
                                            >
                                                Reset Sandbox database
                                            </button>
                                            <p className="text-[10px] text-slate-450 font-medium max-w-md">Resets mock values to default structures (useful to restore mock sheets for CFO, Printing Head, Support Center, etc.)</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'mappings' && (
                                <div className="flex flex-col gap-4 py-2">
                                    <div className="flex items-center justify-between">
                                        <h4 className="text-sm font-bold text-slate-700">Spreadsheet to Department Head Mappings</h4>
                                        <button
                                            onClick={addMappingRow}
                                            className="px-3.5 py-1.5 bg-teal-500 hover:bg-teal-400 text-slate-950 text-xs font-bold rounded-lg transition-all flex items-center gap-1 cursor-pointer shadow shadow-teal-500/10"
                                        >
                                            <Icon name="plus" className="w-3.5 h-3.5" /> Add Department
                                        </button>
                                    </div>

                                    {/* Mapping Table */}
                                    <div className="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50 shadow">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200 text-[10px] text-slate-500 font-bold uppercase tracking-wider">
                                                    <th className="p-3 w-1/4 font-bold">Department Name</th>
                                                    <th className="p-3 w-1/5 font-bold">Head Name</th>
                                                    <th className="p-3 w-1/4 font-bold">Head Google Email</th>
                                                    <th className="p-3 w-1/3 font-bold">Spreadsheet ID</th>
                                                    <th className="p-3 text-right font-bold">Delete</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {localMappings.length === 0 ? (
                                                    <tr>
                                                        <td colSpan={5} className="p-8 text-center text-slate-400 italic">No department mappings configured. Add a row above.</td>
                                                    </tr>
                                                ) : (
                                                    localMappings.map((m, idx) => (
                                                        <tr key={m.id} className="hover:bg-slate-50/50">
                                                            {/* Dept Name */}
                                                            <td className="p-2">
                                                                <input
                                                                    type="text"
                                                                    required
                                                                    value={m.deptName}
                                                                    onChange={(e) => handleMappingChange(idx, 'deptName', e.target.value)}
                                                                    placeholder="e.g. Support Center"
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500"
                                                                />
                                                            </td>
                                                            {/* Head Name */}
                                                            <td className="p-2">
                                                                <input
                                                                    type="text"
                                                                    required
                                                                    value={m.headName}
                                                                    onChange={(e) => handleMappingChange(idx, 'headName', e.target.value)}
                                                                    placeholder="e.g. Ramesh Panwar"
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500"
                                                                />
                                                            </td>
                                                            {/* Head Email */}
                                                            <td className="p-2">
                                                                <input
                                                                    type="email"
                                                                    required
                                                                    value={m.headEmail}
                                                                    onChange={(e) => handleMappingChange(idx, 'headEmail', e.target.value.toLowerCase())}
                                                                    placeholder="e.g. ramesh@pcil.com"
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none font-mono text-[11px] focus:ring-1 focus:ring-teal-500"
                                                                />
                                                            </td>
                                                            {/* Sheet ID */}
                                                            <td className="p-2">
                                                                <input
                                                                    type="text"
                                                                    required
                                                                    value={m.spreadsheetId}
                                                                    onChange={(e) => handleMappingChange(idx, 'spreadsheetId', e.target.value)}
                                                                    placeholder="Enter spreadsheet ID"
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none font-mono text-[11px] focus:ring-1 focus:ring-teal-500"
                                                                />
                                                            </td>
                                                            {/* Delete */}
                                                            <td className="p-2 text-right">
                                                                <button
                                                                    onClick={() => removeMappingRow(idx)}
                                                                    className="p-2 rounded-lg bg-slate-50 hover:bg-rose-50 border border-slate-200 hover:border-rose-200 text-slate-400 hover:text-rose-600 transition-all cursor-pointer"
                                                                >
                                                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-medium">To configure mappings: locate your department's private spreadsheet on Google Drive, copy the ID from the URL (the characters between `/d/` and `/edit` in: `https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit`), and map it to their Google Login email.</p>
                                </div>
                            )}

                            {activeTab === 'json' && (
                                <div className="flex flex-col gap-4 py-2">
                                    <div className="flex items-center justify-between">
                                        <h4 className="text-sm font-bold text-slate-700">Bulk Configuration Import / Export</h4>
                                        <button
                                            onClick={handleJsonSave}
                                            className="px-3.5 py-1.5 bg-teal-500 hover:bg-teal-400 text-slate-955 text-xs font-bold rounded-lg transition-all flex items-center gap-1 cursor-pointer"
                                        >
                                            <Icon name="check" className="w-3.5 h-3.5" /> Apply JSON Mappings
                                        </button>
                                    </div>

                                    <textarea
                                        rows={10}
                                        value={jsonString}
                                        onChange={(e) => setJsonString(e.target.value)}
                                        className="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-slate-700 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-teal-500"
                                    />
                                    <p className="text-[10px] text-slate-500 font-medium">Export/Copy this JSON to back up mappings, or modify and apply to bulk-update sheets and credentials.</p>
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-3 mt-2 border-t border-slate-200 pt-5">
                            <button
                                onClick={onClose}
                                className="w-1/2 py-3 bg-slate-105 bg-slate-100 hover:bg-slate-200 text-slate-650 font-semibold rounded-xl border border-slate-200 transition-all cursor-pointer text-sm"
                            >
                                Close Settings
                            </button>
                            <button
                                onClick={handleSave}
                                className="w-1/2 py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl transition-all shadow-md shadow-teal-500/10 flex items-center justify-center gap-2 cursor-pointer text-sm"
                            >
                                Save Configuration
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React DOM Hook
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>

                console.log(`[PWA] User installation choice: ${outcome}`);
                setDeferredPrompt(null);
            };

            // Fetch central config on startup if already authenticated
            React.useEffect(() => {
                if (auth && auth.accessToken) {
                    fetchCentralConfiguration(auth.accessToken);
                }
            }, [auth]);

            // Setup GIS Client
            React.useEffect(() => {
                const checkGis = setInterval(() => {
                    if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                        clearInterval(checkGis);
                        setGisLoaded(true);
                    }
                }, 100);
                return () => clearInterval(checkGis);
            }, []);

            React.useEffect(() => {
                if (gisLoaded && clientId) {
                    try {
                        const client = window.google.accounts.oauth2.initTokenClient({
                            client_id: clientId.trim(),
                            scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/gmail.send',
                            callback: (tokenResponse) => {
                                if (tokenResponse.error !== undefined) {
                                    if (oauthRejectRef.current) {
                                        oauthRejectRef.current(new Error(tokenResponse.error));
                                        oauthRejectRef.current = null;
                                        oauthResolveRef.current = null;
                                    }
                                    if (tokenResponse.error === 'immediate_failed') {
                                        console.log('Silent token acquisition failed (immediate_failed).');
                                        handleLogoutSilently();
                                        return;
                                    }
                                    showNotification('OAuth error: ' + tokenResponse.error, 'error');
                                    return;
                                }
                                
                                if (oauthResolveRef.current) {
                                    oauthResolveRef.current(tokenResponse.access_token);
                                    oauthResolveRef.current = null;
                                    oauthRejectRef.current = null;
                                }
                                handleOAuthSuccess(tokenResponse.access_token);
                            },
                        });
                        setTokenClient(client);

                        // Silent auto-login on PWA startup
                        const wasLoggedIn = localStorage.getItem('pcil_user_signed_in') === 'true';
                        const isTokenExpired = !auth || !auth.expiresAt || auth.expiresAt <= Date.now() + 120 * 1000;
                        if (wasLoggedIn && isTokenExpired) {
                            console.log('[PWA init] Attempting silent token restoration...');
                            setTimeout(() => {
                                try {
                                    client.requestAccessToken({ prompt: 'none' });
                                } catch (e) {
                                    console.warn('Failed silent auto-login:', e);
                                }
                            }, 500);
                        }
                    } catch (err) {
                        console.error('Failed to init token client', err);
                    }
                }
            }, [gisLoaded, clientId]);

            // Save settings to localStorage helper
            const saveSettings = (newClientId, newMdEmail, newMappings, newMdSopDocId) => {
                const trimmedClientId = (newClientId || '').trim();
                const trimmedMdEmail = (newMdEmail || '').trim();
                const trimmedMdSopDocId = (newMdSopDocId || '').trim();
                const trimmedMappings = newMappings.map(m => {
                    const res = {
                        ...m,
                        deptName: (m.deptName || '').trim(),
                        headName: (m.headName || '').trim(),
                        headEmail: (m.headEmail || '').trim().toLowerCase(),
                        spreadsheetId: (m.spreadsheetId || '').trim(),
                        sheetTabName: (m.sheetTabName || '').trim(),
                        sopDocId: (m.sopDocId || '').trim()
                    };
                    if (Array.isArray(m.sops)) {
                        res.sops = m.sops;
                    }
                    return res;
                });
                
                localStorage.setItem('pcil_clientId', trimmedClientId);
                localStorage.setItem('pcil_mdEmail', trimmedMdEmail);
                localStorage.setItem('pcil_mdSopDocId', trimmedMdSopDocId);
                localStorage.setItem('pcil_mappings', JSON.stringify(trimmedMappings));
                
                setClientId(trimmedClientId);
                setMdEmail(trimmedMdEmail);
                setMdSopDocId(trimmedMdSopDocId);
                setMappings(trimmedMappings);
                
                showNotification('Settings saved successfully!', 'success');
            };

            // Hidden file uploader handler
            const handleConfigUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const rawText = event.target.result || '';
                    let configObject = null;
                    let isEncrypted = false;
                    
                    try {
                        const trimmed = rawText.trim();
                        if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                            // Plain text JSON
                            configObject = JSON.parse(trimmed);
                        } else {
                            // Encrypted config file
                            isEncrypted = true;
                            const decryptedText = rc4Cipher(CONFIG_KEY, atob(trimmed));
                            configObject = JSON.parse(decryptedText);
                        }
                    } catch (err) {
                        showNotification('Failed to parse configuration file: ' + err.message, 'error');
                        return;
                    }
                    
                    if (configObject && typeof configObject === 'object' && !Array.isArray(configObject)) {
                        if (!configObject.clientId || typeof configObject.clientId !== 'string' || !configObject.clientId.trim()) {
                            showNotification('Failed to configure: Config must contain a valid "clientId" string.', 'error');
                            return;
                        }
                        if (!configObject.mdEmail || typeof configObject.mdEmail !== 'string' || !configObject.mdEmail.trim()) {
                            showNotification('Failed to configure: Config must contain a valid "mdEmail" string.', 'error');
                            return;
                        }
                        if (!configObject.mappings || !Array.isArray(configObject.mappings)) {
                            showNotification('Failed to configure: Config must contain a "mappings" array.', 'error');
                            return;
                        }
                        
                        const isValidMappings = configObject.mappings.every(item => 
                            item.hasOwnProperty('deptName') && 
                            item.hasOwnProperty('headName') && 
                            item.hasOwnProperty('headEmail') && 
                            item.spreadsheetId
                        );
                        if (!isValidMappings) {
                            showNotification('Failed to configure: each mapping object must contain deptName, headName, headEmail, and spreadsheetId.', 'error');
                            return;
                        }
                        
                        const sanitizedMappings = configObject.mappings.map((item, idx) => {
                            const res = {
                                id: item.id || String(Date.now() + idx),
                                deptName: (item.deptName || '').trim(),
                                headName: (item.headName || '').trim(),
                                headEmail: (item.headEmail || '').trim().toLowerCase(),
                                spreadsheetId: (item.spreadsheetId || '').trim(),
                                sheetTabName: (item.sheetTabName || '').trim(),
                                sopDocId: (item.sopDocId || '').trim()
                            };
                            if (Array.isArray(item.sops)) {
                                res.sops = item.sops;
                            }
                            return res;
                        });
                        
                        const mdSop = (configObject.mdSopDocId || configObject.sopDocId || '').trim();
                        saveSettings(configObject.clientId, configObject.mdEmail, sanitizedMappings, mdSop);
                        
                        if (!isEncrypted) {
                            // Download the encrypted version automatically for the admin
                            try {
                                const encryptedData = btoa(rc4Cipher(CONFIG_KEY, JSON.stringify({
                                    clientId: configObject.clientId,
                                    mdEmail: configObject.mdEmail,
                                    mdSopDocId: mdSop,
                                    mappings: sanitizedMappings
                                }, null, 2)));
                                
                                const downloadAnchor = document.createElement('a');
                                downloadAnchor.setAttribute("href", "data:text/plain;charset=utf-8," + encodeURIComponent(encryptedData));
                                downloadAnchor.setAttribute("download", "md_config.json");
                                document.body.appendChild(downloadAnchor);
                                downloadAnchor.click();
                                downloadAnchor.remove();
                                
                                showNotification('Configured! Encrypted configuration downloaded automatically.', 'success');
                            } catch (downloadErr) {
                                console.error('Failed to auto-download encrypted config:', downloadErr);
                                showNotification('Configured successfully, but failed to download encrypted file.', 'success');
                            }
                        } else {
                            showNotification('Application successfully configured!', 'success');
                        }
                        
                        // Reload sheet data immediately after configuration
                        setTimeout(loadSpreadsheetData, 100);
                    } else {
                        showNotification('Failed to configure: Configuration must be an object containing clientId, mdEmail, and mappings.', 'error');
                    }
                };
                reader.readAsText(file);
                // Reset file input value to allow uploading the same file again
                e.target.value = '';
            };

            // Trigger notification banner
            const showNotification = (message, type = 'info') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

             // Google login success handler
             const handleOAuthSuccess = async (accessToken) => {
                 setLoading(true);
                 try {
                     // Fetch user info from Google API
                     const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                         headers: { 'Authorization': `Bearer ${accessToken}` }
                     });
                     const userInfo = await res.json();
                     
                     if (userInfo.email) {
                         const authData = {
                             accessToken,
                             email: userInfo.email.toLowerCase(),
                             name: userInfo.name || userInfo.email,
                             picture: userInfo.picture || '',
                             expiresAt: Date.now() + 3600 * 1000 // expires in 1 hour
                         };
                         setAuth(authData);
                         localStorage.setItem('pcil_auth', JSON.stringify(authData));
                         localStorage.setItem('pcil_user_signed_in', 'true');
                         setCookie('pcil_auth', authData, authData.expiresAt);
                         setIsSandbox(false);
                         showNotification(`Logged in as ${userInfo.name || userInfo.email}`, 'success');
                         await fetchCentralConfiguration(accessToken);
                     } else {
                         throw new Error('Could not retrieve email address.');
                     }
                 } catch (err) {
                     showNotification('Sign-in failed: ' + err.message, 'error');
                 } finally {
                     setLoading(false);
                 }
             };

             const requestTokenPromise = (options) => {
                 return new Promise((resolve, reject) => {
                     if (!tokenClient) {
                         reject(new Error('Google Client is not initialized yet.'));
                         return;
                     }
                     oauthResolveRef.current = resolve;
                     oauthRejectRef.current = reject;
                     try {
                         tokenClient.requestAccessToken(options);
                     } catch (err) {
                         oauthResolveRef.current = null;
                         oauthRejectRef.current = null;
                         reject(err);
                     }
                 });
             };

             const ensureValidToken = async () => {
                 if (isSandbox) return 'sandbox_token';

                 // 1. If we have a valid auth token in memory (with a 2-minute safety buffer)
                 if (auth && auth.accessToken && auth.expiresAt && auth.expiresAt > Date.now() + 120 * 1000) {
                     return auth.accessToken;
                 }

                 // 2. If it's expired/missing but we were previously logged in, try silent refresh
                 if (localStorage.getItem('pcil_user_signed_in') === 'true') {
                     try {
                         console.log('[Auth] Token expired or missing. Attempting silent token refresh...');
                         const token = await requestTokenPromise({ prompt: 'none' });
                         return token;
                     } catch (err) {
                         console.warn('[Auth] Silent token refresh failed, prompting user:', err);
                     }
                 }

                 // 3. Fall back to manual prompt if silent auth failed
                showNotification('Your session has expired. Re-authorizing...', 'info');
                 const token = await requestTokenPromise({ prompt: 'select_account' });
                 return token;
             };

             const triggerGoogleLogin = () => {
                 if (!tokenClient) {
                     showNotification('Google OAuth Client ID is missing or incorrect. Click settings (cog) to check.', 'error');
                     return;
                 }
                 requestTokenPromise({ prompt: 'select_account' }).catch(err => {
                     console.error('Manual login failed:', err);
                 });
             };

             const handleLogout = () => {
                 setAuth(null);
                 localStorage.removeItem('pcil_auth');
                 localStorage.removeItem('pcil_user_signed_in');
                 eraseCookie('pcil_auth');
                 setIsSandbox(false);
                 setDirectives([]);
                 showNotification('Logged out successfully.', 'info');
             };

             const handleLogoutSilently = () => {
                 setAuth(null);
                 localStorage.removeItem('pcil_auth');
                 localStorage.removeItem('pcil_user_signed_in');
                 eraseCookie('pcil_auth');
                 setIsSandbox(false);
             };

            const isPendingMoreThan24Hours = (dateStr) => {
                if (!dateStr) return false;
                const createdDate = parseDateString(dateStr);
                if (!createdDate || isNaN(createdDate.getTime()) || createdDate.getTime() === 0) return false;
                const now = new Date();
                const diffMs = now.getTime() - createdDate.getTime();
                return diffMs > 24 * 60 * 60 * 1000;
            };

            const isPendingMoreThan72Hours = (dateStr) => {
                if (!dateStr) return false;
                const createdDate = parseDateString(dateStr);
                if (!createdDate || isNaN(createdDate.getTime()) || createdDate.getTime() === 0) return false;
                const now = new Date();
                const diffMs = now.getTime() - createdDate.getTime();
                return diffMs > 72 * 60 * 60 * 1000;
            };

            const isDirectiveOverdue = (d) => {
                if (!d) return false;
                const isPending = d.status !== 'Completed' && d.status !== 'Checked & Confirmed' && d.status !== 'Deleted';
                if (!isPending) return false;
                if (d.type === 'WSR') return false;

                // If target date is specified and is a valid calendar date
                if (d.targetDate && d.targetDate !== 'Immediate' && d.targetDate !== '-') {
                    const targetDateObj = parseDateString(d.targetDate);
                    if (targetDateObj && !isNaN(targetDateObj.getTime()) && targetDateObj.getTime() !== 0) {
                        const todayDate = new Date();
                        todayDate.setHours(0, 0, 0, 0);

                        const targetDateMidnight = new Date(targetDateObj);
                        targetDateMidnight.setHours(0, 0, 0, 0);

                        return todayDate.getTime() > targetDateMidnight.getTime();
                    }
                }

                // Do not treat as overdue (no 72 hours fallback)
                return false;
            };

            const triggerIndividualReminder = async (d) => {
                if (!isSandbox) {
                    try {
                        const tokenVal = await ensureValidToken();
                        if (!tokenVal) return;
                    } catch (err) {
                        return;
                    }
                }

                const email = (d.headEmail || '').trim().toLowerCase();
                if (!email) {
                    showNotification('No email mapping found for this department head.', 'error');
                    return;
                }

                setReminderTarget(d);
            };

            const sendIndividualReminderSubmit = async () => {
                if (!reminderTarget) return;

                const d = reminderTarget;
                const email = (d.headEmail || '').trim().toLowerCase();
                const headName = d.headName || 'Coordinator';
                const deptName = d.departmentName || 'your department';
                
                const subject = `[MD Command Center] Pending Directive Reminder - ${deptName}`;
                
                let body = `Dear ${headName},\n\nThis is a reminder regarding the following directive assigned to ${deptName} that has been pending for more than 24 hours:\n\n`;
                body += `Directive (Row ${d.excelRowNumber})\n`;
                body += `Issued Date: ${d.date}\n`;
                if (d.type) body += `Type: ${d.type}\n`;
                if (d.priority) body += `Priority: ${d.priority}\n`;
                if (d.targetDate) body += `Target Date: ${d.targetDate}\n`;
                body += `Details: ${d.description}\n`;
                if (d.remark) body += `Current Logs: ${d.remark}\n\n`;
                
                body += `Please review this task and update its status/progress logs in the MD Command Center dashboard as soon as possible.\n\nRegards,\nManaging Director Office`;

                setReminderLoading(true);
                try {
                    await sendEmailViaGmail(email, subject, body);
                    showNotification(`Reminder email sent successfully to ${headName}.`, 'success');
                    setReminderTarget(null);
                } catch (err) {
                    console.error(`Failed to send reminder to ${email}:`, err);
                    showNotification(`Failed to send reminder email: ${err.message}`, 'error');
                } finally {
                    setReminderLoading(false);
                }
            };

            // Identify current role and view mode
            const getActiveUserRole = () => {
                if (isSandbox) {
                    if (sandboxRole === 'MD') {
                        const firstMdEmail = mdEmail.split(',')[0].trim().toLowerCase();
                        return { isMD: true, email: firstMdEmail, name: 'Managing Director (Demo)' };
                    }
                    const targetEmail = sandboxRole.replace(/^DH:/, '').toLowerCase();
                    const matchingMappings = mappings.filter(m => m.headEmail.toLowerCase() === targetEmail);
                    if (matchingMappings.length > 0) {
                        return {
                            isMD: false,
                            email: targetEmail,
                            name: matchingMappings[0].headName || 'Department Head (Demo)',
                            mappings: matchingMappings,
                            mapping: matchingMappings[0]
                        };
                    }
                    return null;
                }
                if (!auth) return null;
                const userEmail = auth.email.toLowerCase();
                const mdEmailsList = mdEmail.split(',').map(e => e.trim().toLowerCase());
                if (mdEmailsList.includes(userEmail)) {
                    return { isMD: true, email: userEmail, name: auth.name };
                }
                const matchingMappings = mappings.filter(m => m.headEmail.toLowerCase() === userEmail);
                if (matchingMappings.length > 0) {
                    return {
                        isMD: false,
                        email: userEmail,
                        name: auth.name,
                        mappings: matchingMappings,
                        mapping: matchingMappings[0]
                    };
                }
                return { isUnregistered: true, email: userEmail, name: auth.name };
            };

            const activeRole = getActiveUserRole();

            // Parser helper to resolve multiple SOP formats (structured arrays, comma-separated lists, name-value pairs, or single doc IDs)
            const parseSops = (mapping, defaultDeptName) => {
                if (!mapping) return [];
                const list = [];
                
                // 1. Structured 'sops' array of objects
                if (Array.isArray(mapping.sops)) {
                    mapping.sops.forEach(sop => {
                        if (sop && sop.id && String(sop.id).trim()) {
                            list.push({
                                name: (sop.name || `${defaultDeptName} SOP`).trim(),
                                id: String(sop.id).trim()
                            });
                        }
                    });
                }
                
                // 2. Parsed 'sopDocId' string (which might contain commas or colon formats)
                if (mapping.sopDocId && String(mapping.sopDocId).trim()) {
                    const rawSop = String(mapping.sopDocId).trim();
                    if (rawSop.includes(',')) {
                        const parts = rawSop.split(',');
                        parts.forEach((part, index) => {
                            const trimmedPart = part.trim();
                            if (!trimmedPart) return;
                            if (trimmedPart.includes(':')) {
                                const subParts = trimmedPart.split(':');
                                const id = subParts[subParts.length - 1].trim();
                                const name = subParts.slice(0, -1).join(':').trim();
                                if (id) {
                                    list.push({ name: name || `${defaultDeptName} SOP ${index + 1}`, id });
                                }
                            } else {
                                list.push({ name: `${defaultDeptName} SOP ${index + 1}`, id: trimmedPart });
                            }
                        });
                    } else if (rawSop.includes(':')) {
                        const subParts = rawSop.split(':');
                        const id = subParts[subParts.length - 1].trim();
                        const name = subParts.slice(0, -1).join(':').trim();
                        if (id) {
                            list.push({ name: name || `${defaultDeptName} SOP`, id });
                        }
                    } else {
                        list.push({ name: `${defaultDeptName} SOP`, id: rawSop });
                    }
                }
                
                // Deduplicate by ID and Name
                const uniqueList = [];
                const seenKeys = new Set();
                list.forEach(item => {
                    const key = `${item.id}|${item.name}`;
                    if (!seenKeys.has(key)) {
                        seenKeys.add(key);
                        uniqueList.push(item);
                    }
                });
                return uniqueList;
            };

            const activeSopDocs = React.useMemo(() => {
                const role = activeRole;
                if (!role) return [];
                if (role.isUnregistered && !isInPermissionsSheet) return [];
                
                const docs = [];
                
                if (effectivePermissions.CanViewAllSOPs) {
                    if (filterDept !== 'All') {
                        // Filtered department SOPs only
                        if (mappings) {
                            const targetMapping = mappings.find(m => m.id === filterDept);
                            if (targetMapping) {
                                const parsedDeptSops = parseSops(targetMapping, targetMapping.deptName);
                                docs.push(...parsedDeptSops);
                            }
                        }
                    } else {
                        // Add MD Office SOPs
                        if (mdSopDocId && mdSopDocId.trim()) {
                            const parsedMdSops = parseSops({ sopDocId: mdSopDocId }, 'MD Office');
                            docs.push(...parsedMdSops);
                        }
                        
                        // Aggregate all unique department SOPs
                        if (mappings) {
                            mappings.forEach(m => {
                                const parsedDeptSops = parseSops(m, m.deptName);
                                parsedDeptSops.forEach(d => {
                                    if (!docs.some(existing => existing.id === d.id && existing.name === d.name)) {
                                        docs.push(d);
                                    }
                                });
                            });
                        }
                    }
                } else {
                    // Coordinators
                    const coordinatorMappings = role.mappings || (role.mapping ? [role.mapping] : []);
                    coordinatorMappings.forEach(m => {
                        // 1. Resolve explicit department SOPs
                        const parsedDeptSops = parseSops(m, m.deptName);
                        parsedDeptSops.forEach(d => {
                            if (!docs.some(existing => String(existing.id).trim().toLowerCase() === String(d.id).trim().toLowerCase())) {
                                docs.push(d);
                            }
                        });
                        
                        // 2. Resolve group-level SOPs dynamically
                        const groupIds = deptGroups
                            .filter(g => String(g.deptId).trim().toLowerCase() === String(m.id).trim().toLowerCase())
                            .map(g => String(g.groupId).trim().toLowerCase());
                        
                        const groupSopIds = sopMappings
                            .filter(mapRule => {
                                const mType = String(mapRule.type).trim().toLowerCase();
                                const mTarget = String(mapRule.targetId).trim().toLowerCase();
                                return mType === 'group' && (groupIds.includes(mTarget) || mTarget === 'default');
                            })
                            .map(mapRule => String(mapRule.sopId).trim().toLowerCase());
                            
                        groupSopIds.forEach(sopId => {
                            const matchedSop = sops.find(s => String(s.sopId).trim().toLowerCase() === sopId);
                            const sopName = matchedSop?.sopName || sopId;
                            const sopDocId = matchedSop?.sopDocId || '';
                            if (!docs.some(existing => String(existing.id).trim().toLowerCase() === sopId)) {
                                docs.push({ id: sopId, name: sopName, docId: sopDocId });
                            }
                        });
                    });
                }
                
                // Attach parsed policies to each resolved SOP
                return docs.map(doc => {
                    const policies = sops.filter(s => String(s.sopId).trim().toLowerCase() === String(doc.id).trim().toLowerCase());
                    return {
                        ...doc,
                        policies: policies
                    };
                });
            }, [clientId, mdEmail, mappings, auth, mdSopDocId, isSandbox, sandboxRole, activeRole, filterDept, sops, deptGroups, isInPermissionsSheet, effectivePermissions]);

            // Generic helper to send email using Gmail API
            const sendEmailViaGmail = async (toEmail, subject, bodyText) => {
                if (isSandbox) {
                    console.log(`[Sandbox Email Simulation] To: ${toEmail}\nSubject: ${subject}\n\n${bodyText}`);
                    showNotification(`Notification email simulated to ${toEmail}`, 'info');
                    return;
                }

                if (!auth || !auth.accessToken) {
                    console.warn('Cannot send email: auth token is missing.');
                    return;
                }

                try {
                    const emailContent = [
                        `To: ${toEmail}`,
                        `Subject: ${subject}`,
                        `Content-Type: text/plain; charset="UTF-8"`,
                        `MIME-Version: 1.0`,
                        ``,
                        bodyText
                    ].join('\r\n');

                    // Base64url encode the raw MIME message
                    const base64Safe = btoa(unescape(encodeURIComponent(emailContent)))
                        .replace(/\+/g, '-')
                        .replace(/\//g, '_')
                        .replace(/=+$/, '');

                    const response = await fetchWithRetry(
                        'https://gmail.googleapis.com/gmail/v1/users/me/messages/send',
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${auth.accessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                raw: base64Safe
                            })
                        }
                    );

                    if (!response.ok) {
                        const errText = await response.text();
                        console.error('Gmail API Error response:', errText);
                        throw new Error(`Gmail API returned status ${response.status}`);
                    }
                    console.log(`Email successfully sent to ${toEmail}`);
                } catch (err) {
                    console.error('Failed to send email:', err);
                    showNotification(`Could not send email notification: ${err.message}`, 'error');
                }
            };

            // Helper to send email notification to coordinator when a new directive is issued
            const sendGmailNotification = async (recipientEmail, recipientName, deptName, directiveDetails, priority, targetDate) => {
                const subject = `[MD Command Center] New Directive Issued - ${deptName}`;
                const bodyText = [
                    `Dear ${recipientName},`,
                    ``,
                    `A new directive has been issued to your department (${deptName}) on the MD Command Center.`,
                    ``,
                    `--- Directive Details ---`,
                    `Description: ${directiveDetails}`,
                    `Priority: ${priority}`,
                    `Target Date: ${targetDate || 'Not Specified'}`,
                    `--------------------------`,
                    ``,
                    `Please log in to the MD Command Center to review and update the status of this directive.`,
                    ``,
                    `Regards,`,
                    `MD Office`,
                    `PCIL Group`
                ].join('\n');

                await sendEmailViaGmail(recipientEmail, subject, bodyText);
            };

            // Helper to notify MD when an Urgent/Very Urgent directive is updated to On Hold or Completed by coordinator
            const sendMDStatusNotification = async (mdEmailAddr, currentDirective, newStatus, newRemark) => {
                const subject = `[MD Command Center] Urgent Status Update: ${newStatus} (${currentDirective.deptName})`;
                const bodyText = [
                    `Dear MD Sir,`,
                    ``,
                    `The status of an urgent directive for department "${currentDirective.deptName}" has been updated by the coordinator (${currentDirective.headName}).`,
                    ``,
                    `--- Directive Details ---`,
                    `Description: ${currentDirective.description}`,
                    `Priority: ${currentDirective.priority}`,
                    `Old Status: ${currentDirective.status}`,
                    `New Status: ${newStatus}`,
                    `Coordinator Remarks: ${newRemark || 'None'}`,
                    `--------------------------`,
                    ``,
                    `Please log in to the MD Command Center to review this update.`,
                    ``,
                    `Regards,`,
                    `MD Command Center System`
                ].join('\n');

                await sendEmailViaGmail(mdEmailAddr, subject, bodyText);
            };

            // Background Notification Checker for repeating directives
            const notifiedThisSession = React.useRef(new Set());

            // Clear notified session cache when role/environment changes
            React.useEffect(() => {
                notifiedThisSession.current.clear();
            }, [sandboxRole, isSandbox, activeRole]);

            const checkAndSendBackgroundReminders = React.useCallback(async (allDirectives) => {
                if (!allDirectives || allDirectives.length === 0) return;

                const today = new Date();

                // Helper to update regular directive remark
                const updateDirectiveRemarkLocallyAndOnSheet = async (d, updatedRemark, notificationTag) => {
                    const excelRowNumber = d.excelRowNumber;
                    const updatedRowValues = assembleUpdatedRow(d, { remark: updatedRemark });
                    if (isSandbox) {
                        const sheetId = d.spreadsheetId;
                        setMockDb(prev => {
                            const sheetRows = [...(prev[sheetId] || [])];
                            sheetRows[excelRowNumber - 1] = updatedRowValues;
                            return { ...prev, [sheetId]: sheetRows };
                        });
                        d.remark = updatedRemark;
                    } else {
                        const activeTabName = d.sheetTabName || 'Master Data';
                        const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                        const response = await fetchWithRetry(
                            `https://sheets.googleapis.com/v4/spreadsheets/${d.spreadsheetId}/values/${encodeURIComponent(quotedTab)}!A${excelRowNumber}?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${auth.accessToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ values: [updatedRowValues] })
                            }
                        );
                        if (response.ok) {
                            d.remark = updatedRemark;
                        }
                    }
                };

                // Helper to update WSR directive status with notification tag
                const updateDirectiveWsrStatusWithTag = async (d, updatedStatusVal, notificationTag) => {
                    const excelRowNumber = d.excelRowNumber;
                    const updatedRowValues = assembleUpdatedRow(d, { status: updatedStatusVal });
                    if (isSandbox) {
                        const sheetId = `${d.spreadsheetId}_WSR`;
                        setMockDb(prev => {
                            const sheetRows = [...(prev[sheetId] || [])];
                            sheetRows[excelRowNumber - 1] = updatedRowValues;
                            return { ...prev, [sheetId]: sheetRows };
                        });
                        d.remark = notificationTag;
                    } else {
                        const activeTabName = 'WSR';
                        const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                        const response = await fetchWithRetry(
                            `https://sheets.googleapis.com/v4/spreadsheets/${d.spreadsheetId}/values/${encodeURIComponent(quotedTab)}!A${excelRowNumber}?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${auth.accessToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ values: [updatedRowValues] })
                            }
                        );
                        if (response.ok) {
                            d.remark = notificationTag;
                        }
                    }
                };

                // 1. Process Reports directives (one-by-one as before)
                const reportDirectives = allDirectives.filter(d => d.type === 'Reports');
                for (const d of reportDirectives) {
                    if (!isDueToday(d.type, d.repetition)) continue;
                    const periodCode = getPeriodCode(today, d.type, d.repetition);
                    if (!periodCode) continue;

                    const uniqueKey = `${d.spreadsheetId}_${d.sheetTabName}_${d.excelRowNumber}_${periodCode}`;
                    if (notifiedThisSession.current.has(uniqueKey)) continue;

                    const notificationTag = `[Notified: ${periodCode}]`;
                    if (d.remark && d.remark.includes(notificationTag)) {
                        notifiedThisSession.current.add(uniqueKey);
                        continue;
                    }

                    notifiedThisSession.current.add(uniqueKey);

                    try {
                        const subject = `[MD Command Center Reminder] Repeating directive due - ${d.deptName}`;
                        const scheduleLabel = `Report Timeline (${d.repetition})`;
                        const bodyText = [
                            `Dear ${d.headName},`,
                            ``,
                            `This is an automated reminder for a scheduled repeating report due today:`,
                            ``,
                            `--- Report Details ---`,
                            `Type: ${d.type}`,
                            d.reportName ? `Report Name: ${d.reportName}` : null,
                            `Schedule: ${scheduleLabel}`,
                            `Description: ${d.description}`,
                            `Priority: ${d.priority}`,
                            `--------------------------`,
                            ``,
                            `Please log in to the MD Command Center to complete this directive for the period ${periodCode}.`,
                            ``,
                            `Regards,`,
                            `MD Office`,
                            `PCIL Group`
                        ].filter(line => line !== null).join('\n');

                        await sendEmailViaGmail(d.headEmail, subject, bodyText);

                        const updatedRemark = d.remark ? `${d.remark} ${notificationTag}` : notificationTag;
                        await updateDirectiveRemarkLocallyAndOnSheet(d, updatedRemark, notificationTag);
                    } catch (err) {
                        console.error(`Failed to send reminder for report ${d.excelRowNumber}:`, err);
                    }
                }

                // 2. Process WSR directives (grouped by headEmail for collective notification)
                const wsrDirectives = allDirectives.filter(d => d.type === 'WSR');
                const wsrByGroup = {};
                
                for (const d of wsrDirectives) {
                    if (!isDueToday(d.type, d.repetition)) continue;
                    const periodCode = getPeriodCode(today, d.type, d.repetition);
                    if (!periodCode) continue;

                    const uniqueKey = `${d.spreadsheetId}_${d.sheetTabName}_${d.excelRowNumber}_${periodCode}`;
                    if (notifiedThisSession.current.has(uniqueKey)) continue;

                    const notificationTag = `[Notified: ${periodCode}]`;
                    if (d.remark && d.remark.includes(notificationTag)) {
                        notifiedThisSession.current.add(uniqueKey);
                        continue;
                    }

                    const email = d.headEmail.toLowerCase();
                    if (!wsrByGroup[email]) {
                        wsrByGroup[email] = {
                            directives: [],
                            headName: d.headName,
                            periodCode,
                            notificationTag
                        };
                    }
                    wsrByGroup[email].directives.push(d);
                }

                // Send collective WSR emails
                for (const email of Object.keys(wsrByGroup)) {
                    const group = wsrByGroup[email];
                    const pendingWsrs = group.directives;
                    if (pendingWsrs.length === 0) continue;

                    // Mark as notified in session immediately to prevent double fires
                    pendingWsrs.forEach(d => {
                        const uKey = `${d.spreadsheetId}_${d.sheetTabName}_${d.excelRowNumber}_${group.periodCode}`;
                        notifiedThisSession.current.add(uKey);
                    });

                    try {
                        const subject = `[MD Command Center Reminder] WSR Weekly Affirmations Due`;
                        const wsrListText = pendingWsrs.map((d, index) => `${index + 1}. ${d.description}`).join('\n');
                        const bodyText = [
                            `Dear ${group.headName},`,
                            ``,
                            `This is an automated collective reminder for your weekly WSR affirmations due today:`,
                            ``,
                            `--- WSR Affirmation List ---`,
                            wsrListText,
                            `-----------------------------`,
                            ``,
                            `Please log in to the MD Command Center to complete these weekly affirmations for the period ${group.periodCode}.`,
                            ``,
                            `Regards,`,
                            `MD Office`,
                            `PCIL Group`
                        ].join('\n');

                        // Send single email
                        await sendEmailViaGmail(email, subject, bodyText);
                        console.log(`Sent collective WSR email to ${email} for ${pendingWsrs.length} WSRs`);

                        // Update each directive status on Google Sheets
                        for (const d of pendingWsrs) {
                            const cleanStatus = d.status || 'Pending';
                            const updatedStatusVal = `${cleanStatus} ${group.notificationTag}`;
                            await updateDirectiveWsrStatusWithTag(d, updatedStatusVal, group.notificationTag);
                        }
                    } catch (err) {
                        console.error(`Failed to send collective WSR reminder for ${email}:`, err);
                    }
                }

                // 3. Process 72h Overdue Pending Directives
                const overdueDirectives = allDirectives.filter(d => isDirectiveOverdue(d));

                for (const d of overdueDirectives) {
                    const uniqueKey = `${d.spreadsheetId}_${d.sheetTabName}_${d.excelRowNumber}_Overdue72h`;
                    if (notifiedThisSession.current.has(uniqueKey)) continue;

                    const notificationTag = `[Overdue72h]`;
                    if (d.remark && d.remark.includes(notificationTag)) {
                        notifiedThisSession.current.add(uniqueKey);
                        continue;
                    }

                    notifiedThisSession.current.add(uniqueKey);

                    try {
                        const email = (d.headEmail || '').trim().toLowerCase();
                        if (!email) continue;

                        const headName = d.headName || 'Coordinator';
                        const deptName = d.departmentName || 'your department';
                        const subject = `[MD Command Center] URGENT: Overdue Task Notification - Row ${d.excelRowNumber} (${deptName})`;
                        
                        const bodyText = [
                            `Dear ${headName},`,
                            ``,
                            `This is an automated URGENT notification that the following task assigned to ${deptName} has exceeded 72 hours of pending elapsed time.`,
                            `Please complete this task and get it audited by Managing Director (MD sir) ASAP.`,
                            ``,
                            `--- Overdue Task Details ---`,
                            `Spreadsheet Row: Row ${d.excelRowNumber}`,
                            `Department: ${deptName}`,
                            `Issued Date: ${d.date}`,
                            `Type: ${d.type}`,
                            `Priority: ${d.priority}`,
                            `Description: ${d.description}`,
                            `Current Logs/Remarks: ${d.remark || 'None'}`,
                            `-----------------------------`,
                            ``,
                            `Please log in to the MD Command Center to update your progress.`,
                            ``,
                            `Regards,`,
                            `MD Command Center Office`,
                            `PCIL Group`
                        ].join('\n');

                        await sendEmailViaGmail(email, subject, bodyText);
                        console.log(`Sent 72h overdue background email to ${email} for Row ${d.excelRowNumber}`);

                        const updatedRemark = d.remark ? `${d.remark} ${notificationTag}` : notificationTag;
                        await updateDirectiveRemarkLocallyAndOnSheet(d, updatedRemark, notificationTag);
                        
                        showNotification(`Automated URGENT reminder sent to ${headName} for Row ${d.excelRowNumber}`, 'info');
                    } catch (err) {
                        console.error(`Failed to send automated 72h overdue email for Row ${d.excelRowNumber}:`, err);
                    }
                }
            }, [auth, isSandbox, mockDb, setMockDb]);

            // Fetch Sheets data
            const loadSpreadsheetData = React.useCallback(async () => {
                if (!activeRole) return;
                
                const now = Date.now();
                if (syncLock.current || (now - lastSyncTime.current < 2500)) {
                    console.log("[Quota Optimization] Sync skipped: already running or cooldown active.");
                    return;
                }
                
                syncLock.current = true;
                lastSyncTime.current = now;
                setLoading(true);
                const statuses = {};
                let compiledDirectives = [];

                if (isSandbox) {
                    // Sandbox loading
                    if (effectivePermissions.CanVerifyDirectives) {
                        // Aggregate all sheets
                        mappings.forEach(map => {
                            const sheetRows = mockDb[map.spreadsheetId] || [];
                            const parsed = parseSheetRows(sheetRows, map);
                            
                            const wsrRows = mockDb[map.spreadsheetId + "_WSR"] || [];
                            const parsedWsr = parseWsrSheetRows(wsrRows, map);
                            
                            compiledDirectives = [...compiledDirectives, ...parsed, ...parsedWsr];
                            statuses[map.spreadsheetId] = { status: 'success' };
                        });
                    } else if (activeRole.mappings) {
                        activeRole.mappings.forEach(map => {
                            const sheetRows = mockDb[map.spreadsheetId] || [];
                            const parsed = parseSheetRows(sheetRows, map);
                            
                            const wsrRows = mockDb[map.spreadsheetId + "_WSR"] || [];
                            const parsedWsr = parseWsrSheetRows(wsrRows, map);
                            
                            compiledDirectives = [...compiledDirectives, ...parsed, ...parsedWsr];
                            statuses[map.spreadsheetId] = { status: 'success' };
                        });
                    } else if (activeRole.mapping) {
                        const map = activeRole.mapping;
                        const sheetRows = mockDb[map.spreadsheetId] || [];
                        const parsed = parseSheetRows(sheetRows, map);
                        
                        const wsrRows = mockDb[map.spreadsheetId + "_WSR"] || [];
                        const parsedWsr = parseWsrSheetRows(wsrRows, map);
                        
                        compiledDirectives = [...parsed, ...parsedWsr];
                        statuses[map.spreadsheetId] = { status: 'success' };
                    }
                    setDirectives(compiledDirectives);
                    setSyncStatuses(statuses);
                    setLoading(false);
                    checkAndSendBackgroundReminders(compiledDirectives);
                    return;
                }

                // Production loading via Google Sheets API
                let freshMappings = null;
                if (!isSandbox) {
                    try {
                        const tokenVal = await ensureValidToken();
                        if (!tokenVal) {
                            setLoading(false);
                            syncLock.current = false;
                            return;
                        }
                        freshMappings = await fetchCentralConfiguration(tokenVal);
                    } catch (err) {
                        console.warn('Production sync auth check failed:', err);
                        setLoading(false);
                        syncLock.current = false;
                        return;
                    }
                }
                
                try {
                    const currentMappings = freshMappings || mappings;
                    let sheetsToFetch = [];
                    if (effectivePermissions.CanVerifyDirectives) {
                        sheetsToFetch = currentMappings;
                    } else if (auth && auth.email) {
                        const userEmail = auth.email.toLowerCase();
                        sheetsToFetch = currentMappings.filter(m => m.headEmail.toLowerCase() === userEmail);
                    } else {
                        sheetsToFetch = activeRole.mappings || [activeRole.mapping].filter(Boolean);
                    }
                    
                    const fetchSingleTab = async (map) => {
                        try {
                            const activeTabName = (map.sheetTabName || 'Master Data').trim();
                            const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                            const response = await fetchWithRetry(
                                `https://sheets.googleapis.com/v4/spreadsheets/${map.spreadsheetId}/values:batchGet?ranges=${encodeURIComponent(quotedTab + '!A1:Z1000')}&valueRenderOption=FORMATTED_VALUE`,
                                {
                                    headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                                }
                            );
                            if (!response.ok) {
                                let errMsg = '';
                                try {
                                    const errData = await response.json();
                                    errMsg = errData?.error?.message || response.statusText || '';
                                } catch (_) {
                                    errMsg = response.statusText || '';
                                }
                                throw new Error(errMsg || `status ${response.status}`);
                            }
                            const data = await response.json();
                            statuses[map.spreadsheetId] = { status: 'success' };
                            const regularValues = data.valueRanges[0]?.values || [];
                            return parseSheetRows(regularValues, map);
                        } catch (err) {
                            console.error(`Error loading fallback single sheet for ${map.deptName}:`, err);
                            statuses[map.spreadsheetId] = { status: 'error', error: err.message };
                            return [];
                        }
                    };

                    const fetchPromises = sheetsToFetch.map(async (map) => {
                        const activeTabName = (map.sheetTabName || 'Master Data').trim();
                        const quotedTab = `'${activeTabName.replace(/'/g, "''")}'`;
                        const ranges = [`${quotedTab}!A1:Z1000`];
                        
                        const hasWsr = !missingWsrSheets.current.has(map.spreadsheetId);
                        if (hasWsr) {
                            ranges.push(`'WSR'!A1:C1000`);
                        }
                        
                        try {
                            const queryParams = ranges.map(r => `ranges=${encodeURIComponent(r)}`).join('&');
                            const response = await fetchWithRetry(
                                `https://sheets.googleapis.com/v4/spreadsheets/${map.spreadsheetId}/values:batchGet?${queryParams}&valueRenderOption=FORMATTED_VALUE`,
                                {
                                    headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                                }
                            );
                            
                            if (!response.ok) {
                                // If WSR doesn't exist, batchGet returns 400 Bad Request
                                if (response.status === 400 && hasWsr) {
                                    missingWsrSheets.current.add(map.spreadsheetId);
                                    console.log(`[Quota Optimization] batchGet failed. Retrying with only regular tab for ${map.deptName}`);
                                    return fetchSingleTab(map);
                                }
                                let errMsg = '';
                                try {
                                    const errData = await response.json();
                                    errMsg = errData?.error?.message || response.statusText || '';
                                } catch (_) {
                                    errMsg = response.statusText || '';
                                }
                                throw new Error(errMsg || `status ${response.status}`);
                            }
                            
                            const data = await response.json();
                            statuses[map.spreadsheetId] = { status: 'success' };
                            
                            const regularValues = data.valueRanges[0]?.values || [];
                            const parsedRegular = parseSheetRows(regularValues, map);
                            
                            let parsedWsr = [];
                            if (hasWsr && data.valueRanges[1]) {
                                const wsrValues = data.valueRanges[1]?.values || [];
                                parsedWsr = parseWsrSheetRows(wsrValues, map);
                            }
                            
                            return [...parsedRegular, ...parsedWsr];
                        } catch (err) {
                            console.error(`Error loading sheet data for ${map.deptName}:`, err);
                            statuses[map.spreadsheetId] = { status: 'error', error: err.message };
                            return [];
                        }
                    });

                    const results = await Promise.all(fetchPromises);
                    results.forEach(rows => {
                        compiledDirectives = [...compiledDirectives, ...rows];
                    });
                    
                    setDirectives(compiledDirectives);
                    setSyncStatuses(statuses);
                    
                    // Notify user of any failed syncs
                    const failedSyncs = Object.entries(statuses).filter(([_, val]) => val.status === 'error');
                    if (failedSyncs.length > 0) {
                        const errorMsg = failedSyncs.map(([sheetId, val]) => {
                            const mapping = sheetsToFetch.find(m => m.spreadsheetId === sheetId);
                            return `${mapping ? mapping.deptName : 'Sheet'}: ${val.error}`;
                        }).join(' | ');
                        showNotification(`Sync Warning: ${errorMsg}`, 'error');
                    }
                    
                    checkAndSendBackgroundReminders(compiledDirectives);
                } catch (err) {
                    showNotification('Error syncing Google Sheets: ' + err.message, 'error');
                } finally {
                    setLoading(false);
                    syncLock.current = false;
                }
            }, [isSandbox, auth, activeRole, mappings, mockDb, checkAndSendBackgroundReminders]);

            // Load data when active role changes
            React.useEffect(() => {
                if (activeRole && !activeRole.isUnregistered) {
                    loadSpreadsheetData();
                }
            }, [sandboxRole, isSandbox, auth, mappings]);

            // Clear missing WSR sheets cache and cooldown when active role or mappings change
            React.useEffect(() => {
                missingWsrSheets.current.clear();
                lastSyncTime.current = 0;
                syncLock.current = false;
            }, [activeRole, mappings]);

            // Save sandbox DB changes to local storage
            React.useEffect(() => {
                if (isSandbox) {
                    localStorage.setItem('pcil_mockDb', JSON.stringify(mockDb));
                }
            }, [mockDb, isSandbox]);

            // Safety guard to reset active tab if Completed Audits is disabled
            React.useEffect(() => {
                if (!showCompletedAudits && activeMetricTab === 'Completed') {
                    setActiveMetricTab('All');
                }
            }, [showCompletedAudits, activeMetricTab]);

            // Auto-check SOP Compliance on login or week change
            React.useEffect(() => {
                // Check if user dismissed the wizard within the last 10 minutes
                const lastDismissedStr = localStorage.getItem('pcil_lastSopDismissedTime');
                if (lastDismissedStr) {
                    const lastDismissed = parseInt(lastDismissedStr, 10);
                    const tenMinutes = 10 * 60 * 1000;
                    if (Date.now() - lastDismissed < tenMinutes) {
                        setIsSopWizardOpen(false);
                        return;
                    }
                }

                const role = getActiveUserRole();
                if (!role || !activeSopDocs || activeSopDocs.length === 0) {
                    setIsSopWizardOpen(false);
                    return;
                }

                // If user is not listed in the permissions sheet, exclude MDs (CanViewAllSOPs) and unregistered users from weekly affirmations
                if (!isInPermissionsSheet) {
                    if (effectivePermissions.CanViewAllSOPs || role.isUnregistered) {
                        setIsSopWizardOpen(false);
                        return;
                    }
                }

                // Get active policies for mapped SOPs
                const activePolicies = [];
                activeSopDocs.forEach(sopDoc => {
                    if (sopDoc.policies) {
                        sopDoc.policies.forEach(policy => {
                            if (String(policy.status).trim().toLowerCase() !== 'inactive') {
                                activePolicies.push(policy);
                            }
                        });
                    }
                });

                if (activePolicies.length === 0) {
                    setIsSopWizardOpen(false);
                    return;
                }

                // Check if user has read all mapped policies for the current week
                const currentWeekCode = getCurrentWeekCode();
                const userEmail = activeRole.email.toLowerCase();
                
                const missingAffirmations = activePolicies.filter(policy => {
                    return !sopReadRecords.some(record => 
                        String(record.userEmail).trim().toLowerCase() === String(userEmail).trim().toLowerCase() &&
                        String(record.weekCode).trim().toLowerCase() === String(currentWeekCode).trim().toLowerCase() &&
                        String(record.sopId).trim().toLowerCase() === String(policy.sopId).trim().toLowerCase() &&
                        String(record.policyId).trim().toLowerCase() === String(policy.policyId).trim().toLowerCase()
                    );
                });

                if (missingAffirmations.length > 0) {
                    setIsSopWizardOpen(true);
                } else {
                    setIsSopWizardOpen(false);
                }
            }, [auth, activeSopDocs, sopReadRecords, isInPermissionsSheet, effectivePermissions]);

            const extractCreatedBy = (text) => {
                if (!text) return { text: '', createdBy: '' };
                const match = String(text).match(/\[CreatedBy:\s*(.*?)\]/i);
                if (match) {
                    const cleanText = text.replace(/\[CreatedBy:\s*(.*?)\]/i, '').trim();
                    return { text: cleanText, createdBy: match[1].trim() };
                }
                return { text: String(text), createdBy: '' };
            };

            // Parse sheet rows, identifying headers dynamically
            const parseSheetRows = (values, mapping) => {
                if (!values || values.length === 0) return [];
                
                // Scan rows to find headers dynamically
                let headerIndex = -1;
                for (let i = 0; i < Math.min(10, values.length); i++) {
                    const row = values[i];
                    if (row && 
                        row.some(cell => typeof cell === 'string' && cell.toLowerCase().includes('date')) &&
                        row.some(cell => typeof cell === 'string' && (
                            cell.toLowerCase().includes('description') || 
                            cell.toLowerCase().includes('task') || 
                            cell.toLowerCase().includes('project') || 
                            cell.toLowerCase().includes('directive') || 
                            cell.toLowerCase().includes('details') || 
                            cell.toLowerCase().includes('work')
                        ))
                    ) {
                        headerIndex = i;
                        break;
                    }
                }

                // Default column indices (fallback to standard layout)
                let dateIdx = 0;
                let typeIdx = 1;
                let descIdx = 2;
                let priorityIdx = 3;
                let targetDateIdx = 4;
                let verificationIdx = 5;
                let statusIdx = 6;
                let remarkIdx = 7;
                let delegatedIdx = 8;
                let completionDateIdx = 9;
                let repetitionIdx = -1;

                let generalRemarksIdx = -1;

                if (headerIndex !== -1) {
                    // Reset to -1 so we don't carry over hardcoded default indices
                    dateIdx = -1;
                    typeIdx = -1;
                    descIdx = -1;
                    priorityIdx = -1;
                    targetDateIdx = -1;
                    verificationIdx = -1;
                    statusIdx = -1;
                    remarkIdx = -1;
                    delegatedIdx = -1;
                    completionDateIdx = -1;
                    repetitionIdx = -1;

                    const headerRow = values[headerIndex];
                    headerRow.forEach((cell, idx) => {
                        if (!cell || typeof cell !== 'string') return;
                        const name = cell.toLowerCase().trim();
                        if (name.includes('date') && !name.includes('target') && !name.includes('completion') && !name.includes('done') && !name.includes('update')) {
                            dateIdx = idx;
                        } else if (name.includes('type')) {
                            typeIdx = idx;
                        } else if (name.includes('description') || name.includes('task') || name.includes('project') || name.includes('directive') || name.includes('details') || name.includes('work')) {
                            descIdx = idx;
                        } else if (name.includes('priority') || name.includes('piority')) {
                            priorityIdx = idx;
                        } else if (name.includes('target') && name.includes('date')) {
                            targetDateIdx = idx;
                        } else if (name.includes('verification') || name.includes('audit')) {
                            verificationIdx = idx;
                        } else if (name.includes('status')) {
                            statusIdx = idx;
                        } else if (name.includes('team remark') || name.includes('it team remark') || name.includes('action log') || name.includes('response')) {
                            remarkIdx = idx;
                        } else if (name.includes('remarks') || name.includes('remark')) {
                            generalRemarksIdx = idx;
                        } else if (name.includes('delegated') || name.includes('assignee') || name.includes('updated by') || name.includes('head') || name.includes('assigned to')) {
                            delegatedIdx = idx;
                        } else if (name.includes('completion') || name.includes('done')) {
                            completionDateIdx = idx;
                        } else if (name.includes('repetition') || name.includes('repeat') || name.includes('submit on') || name.includes('timeline')) {
                            repetitionIdx = idx;
                        }
                    });

                    if (remarkIdx === -1 && generalRemarksIdx !== -1) {
                        remarkIdx = generalRemarksIdx;
                    }
                }

                const maxRowLength = values.reduce((max, r) => Math.max(max, r ? r.length : 0), 0);
                if (completionDateIdx === -1 && maxRowLength > 9) {
                    completionDateIdx = 9; // Fallback to 10th column (Column J)
                }
                if (repetitionIdx === -1 && maxRowLength > 10) {
                    repetitionIdx = 10; // Fallback to 11th column (Column K)
                }

                // If headers not found, assume index 0 is headers or assume starting row
                const dataStartRow = headerIndex !== -1 ? headerIndex + 1 : 1;
                
                const parsedDirectives = [];
                for (let i = dataStartRow; i < values.length; i++) {
                    const row = values[i];
                    const isRowEmpty = !row || row.length === 0 || row.every(cell => cell === undefined || String(cell).trim() === "");
                    if (isRowEmpty) continue;

                    // Extrapolate values dynamically
                    const parsedDate = dateIdx !== -1 && row[dateIdx] ? parseExcelDate(row[dateIdx]) : '';
                    
                    let parsedType = 'Work';
                    if (typeIdx !== -1 && row[typeIdx]) {
                        parsedType = row[typeIdx];
                    }

                    let parsedDesc = '';
                    if (descIdx !== -1 && row[descIdx]) {
                        parsedDesc = row[descIdx];
                    }
                    if (generalRemarksIdx !== -1 && generalRemarksIdx !== descIdx && generalRemarksIdx !== remarkIdx && row[generalRemarksIdx]) {
                        const val = String(row[generalRemarksIdx]).trim();
                        if (val) {
                            parsedDesc = parsedDesc ? `${parsedDesc}\n\nTask Details:\n${val}` : val;
                        }
                    }

                    const extracted = extractCreatedBy(parsedDesc);
                    parsedDesc = extracted.text;
                    const parsedCreatedBy = extracted.createdBy;

                    let parsedReportName = '';
                    if (parsedType === 'Reports') {
                        const match = String(parsedDesc).match(/^Report Name:\s*(.*?)(?:\r?\n\r?\n|\r?\n)([\s\S]*)$/i);
                        if (match) {
                            parsedReportName = match[1].trim();
                            parsedDesc = match[2].trim();
                        } else if (String(parsedDesc).startsWith('Report Name:')) {
                            parsedReportName = String(parsedDesc).substring(12).trim();
                            parsedDesc = '';
                        }
                    }

                    const parsedPriority = priorityIdx !== -1 && row[priorityIdx] ? row[priorityIdx] : 'Normal';
                    const parsedTargetDate = targetDateIdx !== -1 && row[targetDateIdx] ? parseExcelDate(row[targetDateIdx]) : '';
                    const parsedVerification = verificationIdx !== -1 && row[verificationIdx] ? row[verificationIdx] : 'Pending';
                    let parsedRemark = remarkIdx !== -1 && row[remarkIdx] ? String(row[remarkIdx]).trim() : '';
                    const parsedDelegated = delegatedIdx !== -1 && row[delegatedIdx] ? row[delegatedIdx] : '';
                    const parsedRepetition = repetitionIdx !== -1 && row[repetitionIdx] ? String(row[repetitionIdx]).trim() : '';

                    let parsedStatus = statusIdx !== -1 && row[statusIdx] ? String(row[statusIdx]).trim() : 'Pending';

                    // Extract notification tag first to prevent clashing with status matching
                    const notifiedMatch = parsedStatus.match(/\[Notified: (.*?)\]/);
                    if (notifiedMatch) {
                        const tag = notifiedMatch[0];
                        parsedStatus = parsedStatus.replace(/\[Notified: (.*?)\]/, '').trim();
                        if (!parsedRemark.includes(tag)) {
                            parsedRemark = parsedRemark ? `${parsedRemark} ${tag}` : tag;
                        }
                    }

                    let parsedCompletion = completionDateIdx !== -1 && row[completionDateIdx] ? parseExcelDate(row[completionDateIdx]) : '';

                    if (parsedStatus.startsWith('Completed')) {
                        const match = parsedStatus.match(/Completed \((.*?)\)/);
                        if (match) {
                            if (!parsedCompletion) {
                                parsedCompletion = match[1];
                            }
                        }
                        parsedStatus = 'Completed';
                    } else if (parsedStatus.startsWith('Checked & Confirmed')) {
                        const match = parsedStatus.match(/Checked & Confirmed \((.*?)\)/);
                        if (match) {
                            if (!parsedCompletion) {
                                parsedCompletion = match[1];
                            }
                        }
                        parsedStatus = 'Checked & Confirmed';
                    }

                    // Dynamic status reset for repeating WSR and Reports directives
                    if (parsedStatus !== 'Deleted' && parsedRepetition && (parsedType === 'WSR' || parsedType === 'Reports') && parsedRepetition.toLowerCase() !== 'on event') {
                        const currentPeriodCode = getPeriodCode(new Date(), parsedType, parsedRepetition);
                        if (parsedCompletion) {
                            const completionDateObj = parseDateString(parsedCompletion);
                            const completionPeriodCode = getPeriodCode(completionDateObj, parsedType, parsedRepetition);
                            
                            // If the directive was completed in a past period, dynamically treat it as Pending for this period!
                            if (completionPeriodCode !== currentPeriodCode) {
                                parsedStatus = 'Pending';
                                parsedCompletion = '';
                            }
                        } else {
                            parsedStatus = 'Pending';
                        }
                    }

                    parsedDirectives.push({
                        excelRowNumber: i + 1, // 1-indexed row number in the actual Google Sheet
                        spreadsheetId: mapping.spreadsheetId,
                        sheetTabName: (mapping.sheetTabName || 'Master Data').trim(),
                        departmentId: mapping.id,
                        departmentName: mapping.deptName,
                        deptName: mapping.deptName,
                        headName: mapping.headName,
                        headEmail: mapping.headEmail,
                        
                        date: parsedDate,
                        type: parsedType,
                        description: parsedDesc,
                        reportName: parsedReportName,
                        priority: parsedPriority,
                        targetDate: parsedTargetDate,
                        verification: parsedVerification,
                        status: parsedStatus,
                        remark: parsedRemark,
                        delegatedTo: parsedDelegated,
                        completionDate: parsedCompletion,
                        repetition: parsedRepetition,
                        createdBy: parsedCreatedBy,

                        // Dynamic metadata tracking for safe updates
                        columnIndices: {
                            dateIdx,
                            typeIdx,
                            descIdx,
                            priorityIdx,
                            targetDateIdx,
                            verificationIdx,
                            statusIdx,
                            remarkIdx,
                            delegatedIdx,
                            completionDateIdx,
                            generalRemarksIdx,
                            repetitionIdx
                        },
                        originalRowValues: row
                    });
                }
                return parsedDirectives;
            };

            // Parse WSR specific sheet rows
            const parseWsrSheetRows = (values, mapping) => {
                if (!values || values.length === 0) return [];
